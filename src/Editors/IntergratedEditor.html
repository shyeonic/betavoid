<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>beta-void Integrated Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #0d0f10;
      --panel: #151819;
      --panel-2: #1b2021;
      --panel-3: #222829;
      --line: rgba(195, 210, 200, 0.16);
      --line-strong: rgba(195, 210, 200, 0.28);
      --text: #d9e3dd;
      --muted: #8b9b94;
      --quiet: #64716c;
      --accent: #44d7b6;
      --accent-2: #f4b35e;
      --danger: #f05d5e;
      --warn: #e9c46a;
      --info: #7cb7ff;
      --ok: #5dd39e;
      --field: #0f1213;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      font-size: 12px;
      overflow: hidden;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-3);
      color: var(--text);
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: #293031;
    }

    button:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .btn-primary {
      border-color: rgba(68, 215, 182, 0.42);
      background: rgba(68, 215, 182, 0.12);
      color: var(--accent);
    }

    .btn-warn {
      border-color: rgba(244, 179, 94, 0.42);
      background: rgba(244, 179, 94, 0.10);
      color: var(--accent-2);
    }

    .btn-danger {
      border-color: rgba(240, 93, 94, 0.42);
      background: rgba(240, 93, 94, 0.10);
      color: #ff9a9a;
    }

    .btn-small {
      height: 26px;
      padding: 0 8px;
      font-size: 11px;
    }

    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
      min-height: 30px;
      padding: 6px 8px;
      outline: none;
      width: 100%;
    }

    input[type="color"] {
      padding: 2px;
      min-height: 30px;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      min-height: 16px;
      accent-color: var(--accent);
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(68, 215, 182, 0.62);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.45;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }

    .app {
      display: grid;
      grid-template-rows: 84px 1fr;
      width: 100%;
      height: 100%;
    }

    .topbar {
      display: grid;
      grid-template-rows: 36px 48px;
      background: #111414;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 26px var(--shadow);
      z-index: 10;
    }

    .window-titlebar {
      display: grid;
      grid-template-columns: 260px 1fr auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 0 14px;
      border-bottom: 1px solid rgba(195, 210, 200, 0.08);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--accent);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-file {
      min-width: 120px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--quiet);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }

    .capsule-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .capsule-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 650;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      white-space: nowrap;
      font-size: 11px;
    }

    .pill.ok { color: var(--ok); border-color: rgba(93, 211, 158, 0.34); }
    .pill.warn { color: var(--warn); border-color: rgba(233, 196, 106, 0.36); }
    .pill.err { color: #ff9a9a; border-color: rgba(240, 93, 94, 0.42); }

    .command-bar {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
      overflow-x: auto;
      padding: 6px 10px;
      background: #151819;
    }

    .command-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 0 10px;
      border-right: 1px solid var(--line);
    }

    .command-group:first-child {
      padding-left: 0;
    }

    .command-spacer {
      flex: 1 1 auto;
      min-width: 0;
    }

    .command-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 10px;
      color: var(--quiet);
    }

    .workspace {
      display: grid;
      grid-template-columns: 210px 1fr;
      min-height: 0;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .tab-btn {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 38px;
      border-radius: 6px;
      background: transparent;
      text-align: left;
      color: var(--muted);
    }

    .tab-btn:hover {
      background: var(--panel-2);
    }

    .tab-btn.active {
      background: rgba(68, 215, 182, 0.10);
      border-color: rgba(68, 215, 182, 0.34);
      color: var(--text);
    }

    .tab-index {
      color: var(--quiet);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .tab-count {
      color: var(--quiet);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .content {
      min-width: 0;
      min-height: 0;
      background: var(--bg);
      overflow: hidden;
    }

    .tab-page {
      display: none;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .tab-page.active {
      display: block;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 46px;
      padding: 0 14px;
      background: #111414;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      font-size: 13px;
      font-weight: 760;
      color: var(--text);
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .map-shell {
      display: grid;
      grid-template-columns: 270px minmax(340px, 1fr) 330px;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .side {
      background: var(--panel);
      overflow: auto;
      min-height: 0;
    }

    .side.left {
      border-right: 1px solid var(--line);
    }

    .side.right {
      border-left: 1px solid var(--line);
    }

    .panel-block {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 108px;
      gap: 8px;
    }

    .panel-title {
      margin-bottom: 8px;
      color: var(--quiet);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .stack {
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .row > * {
      min-width: 0;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .segmented button {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
    }

    .segmented button.active {
      background: rgba(68, 215, 182, 0.12);
      color: var(--accent);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 10px;
    }

    .metric {
      display: grid;
      gap: 2px;
    }

    .metric span {
      color: var(--quiet);
      font-size: 10px;
    }

    .metric b {
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .drop-zone {
      display: grid;
      place-items: center;
      min-height: 76px;
      border: 1px dashed rgba(68, 215, 182, 0.32);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      background: rgba(68, 215, 182, 0.04);
      text-align: center;
      line-height: 1.55;
    }

    .drop-zone.drag-over {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(68, 215, 182, 0.10);
    }

    .cluster-list {
      display: grid;
      gap: 4px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }

    .cluster-row {
      display: grid;
      grid-template-columns: 18px 30px 1fr auto;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      padding: 5px 7px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
    }

    .cluster-row input {
      width: 16px;
      height: 16px;
      min-height: 16px;
      cursor: pointer;
    }

    .cluster-row:hover {
      background: var(--panel-2);
    }

    .cluster-row.enabled {
      border-color: rgba(217, 227, 221, 0.24);
    }

    .cluster-row.active {
      border-color: rgba(217, 227, 221, 0.38);
      background: rgba(217, 227, 221, 0.08);
      color: var(--text);
    }

    .cluster-main {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .cluster-title,
    .cluster-sub {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cluster-title {
      color: var(--text);
      font-weight: 650;
    }

    .cluster-sub {
      color: var(--quiet);
      font-size: 10px;
    }

    .cluster-state {
      color: var(--quiet);
      font-size: 10px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #050606;
    }

    #three-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .map-hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(217, 227, 221, 0.56);
      pointer-events: none;
      font-size: 11px;
    }

    .map-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      background: rgba(13, 15, 16, 0.86);
      backdrop-filter: blur(8px);
      overflow-x: auto;
    }

    .map-footer > * {
      flex: 0 0 auto;
    }

    .coord-input {
      width: 58px;
      text-align: right;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 140px;
      color: var(--quiet);
      text-align: center;
      line-height: 1.6;
    }

    .entity-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .entity-list-panel {
      background: var(--panel);
      border-right: 1px solid var(--line);
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .entity-list {
      overflow: auto;
      padding: 8px;
      display: grid;
      align-content: start;
      gap: 4px;
    }

    .entity-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 44px;
      padding: 7px 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .entity-item:hover {
      background: var(--panel-2);
    }

    .entity-item.active {
      border-color: rgba(68, 215, 182, 0.34);
      background: rgba(68, 215, 182, 0.08);
      color: var(--text);
    }

    .entity-main {
      display: grid;
      gap: 2px;
      min-width: 0;
      text-align: left;
    }

    .entity-id {
      display: block;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entity-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--quiet);
      margin-top: 2px;
    }

    .entity-meta {
      color: var(--quiet);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .detail-panel {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--bg);
    }

    .form-wrap {
      max-width: 1180px;
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .form-section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .form-section h3 {
      margin: 0;
      min-height: 36px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 10px;
      padding: 12px;
    }

    .form-grid.two {
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }

    .form-grid.three {
      grid-template-columns: repeat(3, minmax(160px, 1fr));
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      color: var(--quiet);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .field.inline {
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .field.inline label {
      text-transform: none;
      letter-spacing: 0;
      font-size: 12px;
    }

    .compatibility-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      padding: 12px;
    }

    .compatibility-filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 128px;
      gap: 8px;
      padding: 12px 12px 0;
    }

    .compatibility-option {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
    }

    .compatibility-option input {
      width: 16px;
      height: 16px;
      min-height: 16px;
    }

    .compatibility-option-main {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .compatibility-option-main b,
    .compatibility-option-main span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compatibility-option-main span,
    .compatibility-option-size {
      color: var(--quiet);
      font-size: 10px;
    }

    .slot-card {
      border-top: 1px solid var(--line);
    }

    .slot-card:first-of-type {
      border-top: 0;
    }

    .json-error {
      color: #ff9a9a;
      font-size: 11px;
      min-height: 16px;
      padding: 0 12px 10px;
    }

    .asset-table, .issue-table {
      width: 100%;
      border-collapse: collapse;
    }

    .asset-table th, .asset-table td,
    .issue-table th, .issue-table td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }

    .asset-table th, .issue-table th {
      color: var(--quiet);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #111414;
    }

    .severity {
      display: inline-flex;
      justify-content: center;
      min-width: 64px;
      padding: 3px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .severity.error {
      color: #ffb2b2;
      background: rgba(240, 93, 94, 0.12);
      border: 1px solid rgba(240, 93, 94, 0.34);
    }

    .severity.warning {
      color: #ffe1a3;
      background: rgba(233, 196, 106, 0.12);
      border: 1px solid rgba(233, 196, 106, 0.34);
    }

    .severity.info {
      color: #b9d8ff;
      background: rgba(124, 183, 255, 0.12);
      border: 1px solid rgba(124, 183, 255, 0.34);
    }

    .mono {
      font-family: "Cascadia Mono", Consolas, monospace;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--line);
      flex: 0 0 auto;
    }

    @media (max-width: 1120px) {
      .window-titlebar {
        grid-template-columns: 1fr auto;
      }

      .capsule-strip {
        display: none;
      }

      .workspace {
        grid-template-columns: 176px 1fr;
      }

      .map-shell {
        grid-template-columns: 240px 1fr;
      }

      .side.right {
        display: none;
      }

      .form-grid,
      .form-grid.three,
      .form-grid.two {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
      }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-rows: auto 1fr;
      }

      .topbar {
        grid-template-rows: auto auto;
      }

      .window-titlebar {
        grid-template-columns: 1fr;
        align-items: start;
        gap: 6px;
        min-width: 0;
        padding: 8px 10px;
      }

      .command-bar {
        justify-content: flex-start;
        width: 100%;
        padding: 6px 10px;
      }

      .command-group {
        padding: 0 8px;
      }

      .project-file,
      .command-meta {
        display: none;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .nav {
        display: none;
      }

      .map-shell,
      .entity-layout {
        grid-template-columns: 1fr;
      }

      .side.left,
      .entity-list-panel {
        display: none;
      }

      .form-grid,
      .form-grid.three,
      .form-grid.two {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="window-titlebar">
        <div class="brand">
          <div class="brand-title">beta-void</div>
          <div class="brand-sub">Integrated Editor</div>
        </div>
        <div class="capsule-strip">
          <span id="capsule-name" class="capsule-name">Untitled Project</span>
          <span id="capsule-version" class="pill">0.0.0</span>
          <span id="capsule-status" class="pill ok">Clean</span>
          <span id="validation-pill" class="pill ok">0 issues</span>
        </div>
        <span id="project-file-name" class="project-file">No file</span>
      </div>
      <div class="command-bar" role="toolbar" aria-label="Project file commands">
        <div class="command-group">
          <button id="btn-new-project">New Project</button>
          <button id="btn-open-project">Open</button>
          <button id="btn-save-project" class="btn-primary">Save</button>
        </div>
        <div class="command-group">
          <button id="btn-load-combat-defaults" class="btn-warn" title="Replace weapon, shield, and equipment definitions with the built-in catalog">Load Combat Defaults</button>
          <button id="btn-export-all" class="btn-warn">Export Game Data</button>
        </div>
        <div class="command-spacer"></div>
        <div class="command-meta">
          <span class="pill">Project .ged</span>
        </div>
      </div>
    </header>

    <div class="workspace">

function makeDefaultCombatDefinitions() {
  const weapons = Object.fromEntries(DEFAULT_COMBAT_CATALOG.weapons.map((row) => {
    const [id, size, mass, processing_load, damage_kinetic, damage_thermal, damage_energy, damage_beta, power_use, acc, range, crit_chance, crit_damage] = row;
    return [id, { id, item_id: id, name_id: id + ".name", size, mass, processing_load, damage_kinetic, damage_thermal, damage_energy, damage_beta, power_use, acc, range, crit_chance, crit_damage, special_skill: null }];
  }));
  const shields = Object.fromEntries(DEFAULT_COMBAT_CATALOG.shields.map((row) => {
    const [id, size, mass, processing_load, def_bonus_kinetic, def_bonus_thermal, def_bonus_energy, capacity, recharge_base, recharge_rate, power_use_cap] = row;
    return [id, { id, item_id: id, name_id: id + ".name", size, mass, processing_load, def_bonus_kinetic, def_bonus_thermal, def_bonus_energy, capacity, recharge_base, recharge_rate, power_use_cap }];
  }));
  const equipment = Object.fromEntries(DEFAULT_COMBAT_CATALOG.equipment.map((row) => {
    const [id, size, mass, processing_load, processing_capacity_bonus, power_capacity_bonus, power_recharge_bonus, cargo_capacity_bonus, evasion_bonus, hull_capacity_bonus, hull_recharge_base_bonus] = row;
    return [id, { id, item_id: id, name_id: id + ".name", size, mass, processing_load, processing_capacity_bonus, power_capacity_bonus, power_recharge_bonus, cargo_capacity_bonus, evasion_bonus, hull_capacity_bonus, hull_recharge_base_bonus }];
  }));
  return { weapons, shields, equipment };
}

function loadDefaultCombatCatalog() {
  const combat = capsule.combatEditor;
  const existing = {
    weapons: Object.keys(combat.weapons || {}).length,
    shields: Object.keys(combat.shields || {}).length,
    equipment: Object.keys(combat.equipment || {}).length
  };
  const message = [
    "Replace the current combat definitions with the built-in default catalog?",
    "",
    "Current: " + existing.weapons + " weapons, " + existing.shields + " shields, " + existing.equipment + " equipment",
    "Defaults: " + DEFAULT_COMBAT_CATALOG.weapons.length + " weapons, " + DEFAULT_COMBAT_CATALOG.shields.length + " shields, " + DEFAULT_COMBAT_CATALOG.equipment.length + " equipment",
    "",
    "Compatibility preset IDs and ship slots will remain, but their compatible and equipped item references will be cleared."
  ].join("\n");
  if (!confirm(message)) return;

  const defaults = makeDefaultCombatDefinitions();
  combat.weapons = defaults.weapons;
  combat.shields = defaults.shields;
  combat.equipment = defaults.equipment;
  syncItemDefinitions();
  for (const type of SLOT_TYPES) {
    for (const preset of Object.values(combat.compatibilityPresets?.[type] || {})) preset.compatible_ids = [];
    for (const profile of Object.values(combat.shipProfiles || {})) {
      for (const slot of profile.slots?.[type] || []) slot.equipped_id = null;
    }
  }
  selected.weapons = Object.keys(combat.weapons).sort()[0] || null;
  selected.shields = Object.keys(combat.shields).sort()[0] || null;
  selected.equipment = Object.keys(combat.equipment).sort()[0] || null;
  setDirty();
  rerender();
  setActiveTab("weapons");
}

function createDefaultShipVisual(id, visual = {}) {
  const modelId = visual.modelId || id;
  const reflectionIntensity = Number(visual.materials?.reflectionIntensity ?? visual.reflectionIntensity ?? 0.32);
  const highlightColor = normalizeColorString(visual.highlightColor || firstHighlightColor(visual) || (id === "ship_02" ? "#286d4d" : "#ff97c2"));
  const bindingColor = "#9b9bff";
  const effectBindings = Array.isArray(visual.effectBindings)
    ? normalizeShipEffectBindings(visual.effectBindings)
    : createDefaultShipComponents(id, bindingColor);

  return {
    modelId,
    reflectionIntensity,
    highlightColor,
    effectBindings,
    materials: {
      reflectionIntensity,
      emissiveSurface: {
        materialName: "EmissiveMTL_light",
        fallbackColor: "#ffffff"
      },
      highlights: {
        highlight_01: {
          id: "highlight_01",
          label: "Highlight_01",
          materialName: "Highlight_01",
          defaultColor: highlightColor
        }
      }
    }
  };
}

function createDefaultShipComponents(id, bindingColor = "#9b9bff") {
  const engineId = id === "ship_02" ? "vfx_light_02_engine_001" : "vfx_light_engine_001";
  const components = [
    createShipComponent({
      id: engineId,
      kind: "engine",
      label: `EmissivePlate_${id}.001`,
      effectId: "engine_light_default",
      objectMatches: [`EmissivePlate_${id}.001`],
      engineOutput: true,
      overrides: { color: bindingColor }
    })
  ];

  if (id !== "ship_02") {
    components.push(createShipComponent({
      id: "vfx_light_head_001",
      kind: "head_light",
      label: "EmissivePlate_ship_01.002",
      effectId: "head_light_default",
      objectMatches: ["EmissivePlate_ship_01.002"],
      defaultLight: true
    }));
  }

  const auxPrefix = id === "ship_02" ? "vfx_light_02_aux_" : "vfx_light_aux_";
  const auxLabels = id === "ship_02" ? ["002", "003", "004", "005", "006", "007"] : ["003", "004", "005", "006"];
  for (const label of auxLabels) {
    components.push(createShipComponent({
      id: `${auxPrefix}${label}`,
      kind: "emissive_light",
      label: `EmissivePlate_${id}.${label}`,
      effectId: "aux_light_default",
      objectMatches: [`EmissivePlate_${id}.${label}`],
      overrides: { color: bindingColor }
    }));
  }

  return components;
}

function createShipComponent({
  id,
  kind = "emissive_light",
  label = id,
  effectId = "aux_light_default",
  objectMatches = [],
  materialMatches = [],
  engineOutput = false,
  defaultLight = false,
  overrides = {}
}) {
  return {
    id,
    kind,
    label,
    effectId,
    target: {
      objectMatches: [...objectMatches],
      materialMatches: [...materialMatches]
    },
    engineOutput,
    defaultLight,
    overrides: { ...overrides }
  };
}

function firstHighlightColor(visual = {}) {
  const first = Object.values(visual.materials?.highlights || visual.highlights || {})[0];
  return first?.defaultColor || null;
}

function normalizeColorString(value) {
  if (typeof value === "string") return value;
  const color = Number(value);
  if (!Number.isFinite(color)) return "#ffffff";
  return `#${Math.max(0, Math.min(0xffffff, color)).toString(16).padStart(6, "0")}`;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, "&#96;");
}

function toNumber(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function pathGet(obj, path) {
  return path.split(".").reduce((cur, part) => cur?.[part], obj);
}

function pathSet(obj, path, value) {
  const parts = path.split(".");
  let cur = obj;
  while (parts.length > 1) {
    const part = parts.shift();
    if (!cur[part] || typeof cur[part] !== "object") cur[part] = {};
    cur = cur[part];
  }
  cur[parts[0]] = value;
}

function options(values, current) {
  return values.map((value) => `<option value="${escapeAttr(value)}" ${value === current ? "selected" : ""}>${escapeHtml(value)}</option>`).join("");
}

function idOptions(collection, current, emptyLabel = null) {
  const ids = Object.keys(collection).sort();
  const rows = emptyLabel ? [`<option value="">${escapeHtml(emptyLabel)}</option>`] : [];
  rows.push(...ids.map((id) => `<option value="${escapeAttr(id)}" ${id === current ? "selected" : ""}>${escapeHtml(id)}</option>`));
  return rows.join("");
}

function field(label, html) {
  return `<div class="field"><label>${escapeHtml(label)}</label>${html}</div>`;
}

function input(path, value, type = "text", extra = "") {
  return `<input type="${type}" data-path="${escapeAttr(path)}" value="${escapeAttr(value ?? "")}" ${extra} />`;
}

function numberInput(path, value, step = "1", extra = "") {
  return input(path, value ?? 0, "number", `step="${step}" ${extra}`);
}

function selectInput(path, value, values, extra = "") {
  return `<select data-path="${escapeAttr(path)}" ${extra}>${options(values, value)}</select>`;
}

function checkboxInput(path, checked) {
  return `<label class="field inline"><input type="checkbox" data-path="${escapeAttr(path)}" ${checked ? "checked" : ""} /><span>Enabled</span></label>`;
}

function jsonField(label, path, value) {
  return `<div class="form-section"><h3>${escapeHtml(label)}</h3><textarea data-json-path="${escapeAttr(path)}">${escapeHtml(JSON.stringify(value ?? {}, null, 2))}</textarea><div class="json-error" data-json-error="${escapeAttr(path)}"></div></div>`;
}

function i18nFields(kind, id) {
  const ko = contentEntry(kind, id, "ko");
  const en = contentEntry(kind, id, "en");
  return `
    <div class="form-section">
      <h3>I18n Content</h3>
      <div class="form-grid two">
        ${field("KO Name", `<input data-i18n-lang="ko" data-i18n-field="name" value="${escapeAttr(ko.name ?? "")}" />`)}
        ${field("EN Name", `<input data-i18n-lang="en" data-i18n-field="name" value="${escapeAttr(en.name ?? "")}" />`)}
        ${field(kind === "sector" ? "KO Theme" : "KO Description", `<textarea data-i18n-lang="ko" data-i18n-field="${kind === "sector" ? "theme" : "description"}">${escapeHtml(ko[kind === "sector" ? "theme" : "description"] ?? "")}</textarea>`)}
        ${field(kind === "sector" ? "EN Theme" : "EN Description", `<textarea data-i18n-lang="en" data-i18n-field="${kind === "sector" ? "theme" : "description"}">${escapeHtml(en[kind === "sector" ? "theme" : "description"] ?? "")}</textarea>`)}
      </div>
    </div>
  `;
}

function contentEntry(kind, id, lang) {
  capsule.i18n.content ??= {};
  capsule.i18n.content[lang] ??= {};
  capsule.i18n.content[lang][kind] ??= {};
  capsule.i18n.content[lang][kind][id] ??= kind === "sector" ? { name: id, theme: "" } : { name: id, description: "" };
  return capsule.i18n.content[lang][kind][id];
}

function entityName(kind, id) {
  return contentEntry(kind, id, "en").name || contentEntry(kind, id, "ko").name || id;
}

function setDirty(value = true) {
  dirty = value;

function updateHeader() {
  $("#capsule-name").textContent = projectFileName ? projectFileName.replace(/\.ged$/i, "") : "Untitled Project";
  $("#capsule-version").textContent = `GED v${PROJECT_VERSION}`;
  $("#project-file-name").textContent = projectFileName || "No file";
  $("#project-file-name").title = projectFileName || "";
  const status = $("#capsule-status");
  status.textContent = dirty ? "Dirty" : "Clean";
  status.className = `pill ${dirty ? "warn" : "ok"}`;
  const err = issues.filter((i) => i.level === "ERROR").length;
  const warn = issues.filter((i) => i.level === "WARNING").length;
  const pill = $("#validation-pill");
  pill.textContent = err ? `${err} errors` : warn ? `${warn} warnings` : `${issues.length} issues`;
  pill.className = `pill ${err ? "err" : warn ? "warn" : "ok"}`;
}

function setActiveTab(tab) {

  $$(".tab-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === activeTab));
  $$(".tab-page").forEach((page) => page.classList.toggle("active", page.id === `tab-${activeTab}`));
  if (activeTab === "map") resizeRenderer();
  if (activeTab === "ship-slots") renderShipSlotsPage();
  if (activeTab === "ship-visuals") renderShipVisualPage();
  if (activeTab === "vfx") renderVfxPage();
}

function scrollSelectorForElement(element) {
  if (!element) return null;
  if (element === document.scrollingElement) return "__document__";
  if (element.dataset?.listKind) return `[data-list-kind="${CSS.escape(element.dataset.listKind)}"]`;
  if (element.id) return `#${CSS.escape(element.id)}`;
  if (element.classList?.contains("compatibility-list")) {
    const detail = element.closest(".detail-panel[id]");
    return detail ? `#${CSS.escape(detail.id)} .compatibility-list` : null;
  }
  if (element.classList?.contains("nav")) return ".nav";
  if (element.classList?.contains("side")) return element.classList.contains("left") ? ".side.left" : ".side.right";
  return null;
}

function captureScrollPositions() {
  const positions = new Map();
  const elements = [
    document.scrollingElement,
    ...$$("[data-list-kind], .detail-panel[id], .compatibility-list, .nav, .side")
  ];
  for (const element of elements) {
    const selector = scrollSelectorForElement(element);
    if (!selector || positions.has(selector)) continue;
    positions.set(selector, { top: element.scrollTop || 0, left: element.scrollLeft || 0 });
  }
  return positions;
}

function restoreScrollPositions(positions) {
  for (const [selector, position] of positions.entries()) {
    const element = selector === "__document__" ? document.scrollingElement : $(selector);
    if (!element) continue;
    element.scrollTop = position.top;
    element.scrollLeft = position.left;
  }
}

function withPreservedScroll(callback) {
  const positions = captureScrollPositions();
  const result = callback();
  restoreScrollPositions(positions);
  requestAnimationFrame(() => restoreScrollPositions(positions));
  return result;
}

function shipClassLabel(value) {
  const entry = SHIP_CLASSES.find(([code]) => code === value);
  return entry ? `${entry[0]} - ${entry[1]}` : value || "Unknown";
}

function slotEquipmentOptions(type, slot) {
  const definitions = combatDefinitionsForType(type);
  const preset = capsule.combatEditor.compatibilityPresets?.[type]?.[slot.compatibility_preset_id];
  const compatibleIds = (preset?.compatible_ids || []).filter((id) => definitions[id] && isSizeCompatible(slot.size, definitions[id].size));
  const rows = [`<option value="">Empty</option>`];
  if (slot.equipped_id && !compatibleIds.includes(slot.equipped_id)) {
    rows.push(`<option value="${escapeAttr(slot.equipped_id)}" selected>[Invalid] ${escapeHtml(slot.equipped_id)}</option>`);
  }
  rows.push(...compatibleIds.sort().map((id) => `<option value="${escapeAttr(id)}" ${id === slot.equipped_id ? "selected" : ""}>${escapeHtml(id)} [${escapeHtml(definitions[id].size)}]</option>`));
  return rows.join("");
}

function isSizeCompatible(slotSize, equipmentSize) {
  return (SIZE_COMPATIBILITY[slotSize] || []).includes(equipmentSize);
}

function bindShipProfileControls(root, shipId, profile) {
  root.querySelectorAll("[data-profile-path]").forEach((element) => {
    const eventName = element.type === "checkbox" || element.tagName === "SELECT" ? "change" : "input";
    element.addEventListener(eventName, () => {
      let value = element.type === "number" ? toNumber(element.value) : element.value;
      if (element.dataset.nullable === "true" && element.value === "") value = null;
      pathSet(profile, element.dataset.profilePath, value);
      setDirty();
      runValidation();
      renderIntegrity();
      if (element.dataset.profilePath === "ship_class") updateShipProfileListMeta(shipId, profile);
      if (element.dataset.rerender === "true") renderShipSlotsPage();
    });
  });
  root.querySelectorAll("[data-add-slot-type]").forEach((button) => {
    button.addEventListener("click", () => {
      const type = button.dataset.addSlotType;
      profile.slots[type].push(makeShipSlot(type, profile));
      setDirty();
      renderShipSlotsPage();
      runValidation();
      renderIntegrity();
    });
  });
  root.querySelectorAll("[data-delete-slot-type]").forEach((button) => {
    button.addEventListener("click", () => {
      const type = button.dataset.deleteSlotType;
      const index = Number(button.dataset.deleteSlotIndex);
      if (!confirm(`Delete ${profile.slots[type][index]?.id || `${type} slot`}?`)) return;
      profile.slots[type].splice(index, 1);
      setDirty();
      renderShipSlotsPage();
      runValidation();
      renderIntegrity();
    });
  });
}

function updateShipProfileListMeta(shipId, profile) {
  const shipMeta = $(`[data-list-kind="ships"] [data-id="${CSS.escape(shipId)}"] .entity-meta`);
  if (shipMeta) shipMeta.textContent = shipClassLabel(profile.ship_class || DEFAULT_SHIP_CLASS);
  const slotMeta = $(`[data-list-kind="ship-slots"] [data-select-ship-slots="${CSS.escape(shipId)}"] .entity-meta`);
  if (slotMeta) {
    const slotCount = SLOT_TYPES.reduce((total, type) => total + (profile.slots?.[type]?.length || 0), 0);
    slotMeta.textContent = `${profile.ship_class || DEFAULT_SHIP_CLASS} / ${slotCount} slots`;
  }
}

function makeShipSlot(type, profile) {
  const ids = new Set(SLOT_TYPES.flatMap((slotType) => (profile.slots?.[slotType] || []).map((slot) => slot.id)));
  let index = (profile.slots?.[type]?.length || 0) + 1;
  let id = `${type}_slot_${String(index).padStart(2, "0")}`;
  while (ids.has(id)) {
    index += 1;
    id = `${type}_slot_${String(index).padStart(2, "0")}`;
  }
  return { id, slot_type: type, size: "s", compatibility_preset_id: null, equipped_id: null };
}

function calculateShipProfileSummary(profile) {
  const stats = { ...profile.base_stats };
  let processingLoad = 0;
  for (const type of SLOT_TYPES) {
    const definitions = combatDefinitionsForType(type);
    for (const slot of profile.slots?.[type] || []) {
      const definition = definitions[slot.equipped_id];
      if (!definition) continue;
      processingLoad += Number(definition.processing_load || 0);
      if (type !== "equipment") continue;
      stats.processing_capacity += Number(definition.processing_capacity_bonus || 0);
      stats.power_capacity += Number(definition.power_capacity_bonus || 0);
      stats.power_recharge += Number(definition.power_recharge_bonus || 0);
      stats.cargo_capacity += Number(definition.cargo_capacity_bonus || 0);
      stats.evasion += Number(definition.evasion_bonus || 0);
      stats.hull_capacity += Number(definition.hull_capacity_bonus || 0);
      stats.hull_recharge_base += Number(definition.hull_recharge_base_bonus || 0);
    }
  }
  return {
    processing_load: processingLoad,
    processing_capacity: Number(stats.processing_capacity || 0),
    power_capacity: Number(stats.power_capacity || 0),
    power_recharge: Number(stats.power_recharge || 0),
    cargo_capacity: Number(stats.cargo_capacity || 0),
    evasion: Number(stats.evasion || 0),
    hull_capacity: Number(stats.hull_capacity || 0),
    hull_recharge_base: Number(stats.hull_recharge_base || 0)
  };
}

document.addEventListener("click", (event) => {
  const shipSlotsSelectBtn = event.target.closest("[data-select-ship-slots]");
  if (shipSlotsSelectBtn) {
    selected.shipSlots = shipSlotsSelectBtn.dataset.selectShipSlots;
    renderShipSlotsPage();
    return;
  }
  const vfxSelectBtn = event.target.closest("[data-select-vfx]");
  if (vfxSelectBtn) {
    selected.vfx = vfxSelectBtn.dataset.selectVfx;
    renderVfxPage();
    return;
  }
  const addVfxBtn = event.target.closest("[data-add-vfx]");
  if (addVfxBtn) {
    addVfxEffect();
    return;
  }
  const deleteVfxBtn = event.target.closest("[data-delete-vfx]");
  if (deleteVfxBtn) {
    deleteVfxEffect(deleteVfxBtn.dataset.deleteVfx);
    return;
  }
  const visualSelectBtn = event.target.closest("[data-select-ship-visual]");

    selected.ships = visualSelectBtn.dataset.selectShipVisual;
    renderShipVisualPage();
    return;

  const selectBtn = event.target.closest("[data-select-kind]");

    if (selectBtn.dataset.selectKind === "ships") renderShipVisualPage();
    return;

    addEntity(addBtn.dataset.addKind);
    return;
  }
  const deleteBtn = event.target.closest("[data-delete-kind]");
  if (deleteBtn) {
    deleteEntity(deleteBtn.dataset.deleteKind, deleteBtn.dataset.id);
  }
});

function applyEntityListFilters(kind) {
  const term = $(`[data-search-kind="${kind}"]`)?.value.toLowerCase() || "";
  const size = $(`[data-size-filter-kind="${kind}"]`)?.value || "";
  $$(`[data-list-kind="${kind}"] .entity-item`).forEach((item) => {
    const matchesText = item.textContent.toLowerCase().includes(term);
    const matchesSize = !size || item.dataset.size === size;
    item.style.display = matchesText && matchesSize ? "" : "none";
  });
}

function applyCompatibilityFilters(root) {
  if (!root) return;
  const term = root.querySelector("[data-compatible-search]")?.value.toLowerCase() || "";
  const size = root.querySelector("[data-compatible-size-filter]")?.value || "";
  root.querySelectorAll("[data-compatible-option]").forEach((option) => {
    const matchesText = option.textContent.toLowerCase().includes(term);
    const matchesSize = !size || option.dataset.size === size;
    option.style.display = matchesText && matchesSize ? "" : "none";
  });
}

function bindDetail(detail, kind, id, obj, rerenderOnChange = false) {
  const cfg = entityConfig[kind];
  detail.querySelectorAll("[data-path]").forEach((el) => {
    const eventName = el.type === "checkbox" || el.tagName === "SELECT" || el.dataset.decimals ? "change" : "input";
    el.addEventListener(eventName, () => {
      let value = el.type === "checkbox" ? el.checked : el.value;
      if (el.type === "number") value = toNumber(value);
      pathSet(obj, el.dataset.path, value);
      if (el.dataset.normalize === "int") pathSet(obj, el.dataset.path, Math.round(toNumber(value)));
      if (el.dataset.decimals) {
        const normalized = Number(toNumber(value).toFixed(Number(el.dataset.decimals)));
        pathSet(obj, el.dataset.path, normalized);
        el.value = String(normalized);
      }
      if (el.dataset.nullable === "true" && el.value === "") pathSet(obj, el.dataset.path, null);
      setDirty();
      if (cfg.editorOnly && el.dataset.path === "name_id") {
        const activeItem = detail.closest(".entity-layout")?.querySelector(`.entity-item.active .entity-name`);
        if (activeItem) activeItem.textContent = value || id;
      }
      if (rerenderOnChange || el.dataset.rerender === "true") {
        renderEntityPage(kind);
      } else {
        runValidation();
        renderIntegrity();
        countValues();
        updateMapColors();
      }
    });
  });
  detail.querySelectorAll("[data-json-path]").forEach((el) => {
    el.addEventListener("input", () => {
      const error = detail.querySelector(`[data-json-error="${CSS.escape(el.dataset.jsonPath)}"]`);
      try {
        const value = JSON.parse(el.value || "null");
        pathSet(obj, el.dataset.jsonPath, value);
        if (error) error.textContent = "";
        setDirty();
        runValidation();
        renderIntegrity();
      } catch (err) {
        if (error) error.textContent = err.message;
      }
    });
  });
  detail.querySelectorAll("[data-i18n-lang]").forEach((el) => {
    el.addEventListener("input", () => {
      contentEntry(cfg.singular, id, el.dataset.i18nLang)[el.dataset.i18nField] = el.value;
      setDirty();
      runValidation();
      renderIntegrity();
      const activeItem = detail.closest(".entity-layout")?.querySelector(`.entity-item.active .entity-name`);
      if (activeItem) activeItem.textContent = entityName(cfg.singular, id);
    });
  });
}

function combatDefinitionsForType(type) {
  if (type === "weapon") return capsule.combatEditor.weapons || {};
  if (type === "shield") return capsule.combatEditor.shields || {};
  return capsule.combatEditor.equipment || {};
}

function bindCombatItemMirror(root, type, definition) {
  root.querySelectorAll(`[data-path="item_id"], [data-path="mass"]`).forEach((el) => {
    const eventName = el.type === "number" ? "input" : "input";
    el.addEventListener(eventName, () => syncItemDefinitionForCombat(type, definition));
  });
  syncItemDefinitionForCombat(type, definition);
}

function bindItemCombatMirror(root, itemId, item) {
  root.querySelectorAll(`[data-path="mass"]`).forEach((el) => {
    el.addEventListener("input", () => {
      const definition = combatDefinitionByItemId(itemId);
      if (!definition) return;
      definition.mass = Math.max(1, Math.round(Number(item.mass ?? 1) || 1));
    });
  });
}

function combatDefinitionByItemId(itemId) {
  for (const type of SLOT_TYPES) {
    for (const definition of Object.values(combatDefinitionsForType(type))) {
      if ((definition.item_id || definition.id) === itemId) return definition;
    }
  }
  return null;
}

function bindVfxDetail(root, effect) {
  root.querySelectorAll("[data-vfx-path]").forEach((el) => {
    const eventName = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(eventName, () => {
      let value = el.type === "checkbox" ? el.checked : el.value;
      if (el.type === "number") value = toNumber(value);
      pathSet(effect, el.dataset.vfxPath, value);
      syncVfxEffect(effect);
      setDirty();
      runValidation();
      renderIntegrity();
      countValues();
    });
  });
  root.querySelectorAll("[data-json-path]").forEach((el) => {
    el.addEventListener("input", () => {
      const error = root.querySelector(`[data-json-error="${CSS.escape(el.dataset.jsonPath)}"]`);
      try {
        pathSet(effect, el.dataset.jsonPath, JSON.parse(el.value || "null"));
        if (error) error.textContent = "";
        syncVfxEffect(effect);
        setDirty();
        runValidation();
        renderIntegrity();
      } catch (err) {
        if (error) error.textContent = err.message;
      }
    });
  });
}

function bindShipBindingControls(root, shipId, ship) {
  root.querySelectorAll("[data-ship-component]").forEach((el) => {
    const eventName = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(eventName, () => {
      const component = ship.visual?.effectBindings?.[Number(el.dataset.shipComponent)];
      if (!component) return;
      let value = el.type === "checkbox" ? el.checked : el.value;
      if (el.type === "number") value = toNumber(value);
      pathSet(component, el.dataset.componentPath, value);
      if (el.dataset.componentPath === "engineOutput" && value === true) {
        ship.visual.effectBindings.forEach((item) => { if (item !== component) item.engineOutput = false; });
      }
      if (el.dataset.componentPath === "defaultLight" && value === true) {
        ship.visual.effectBindings.forEach((item) => { if (item !== component) item.defaultLight = false; });
      }
      syncShipVisual(ship);
      setDirty();
      runValidation();
      renderIntegrity();
    });
  });

  root.querySelectorAll("[data-ship-component-lines]").forEach((el) => {
    el.addEventListener("input", () => {
      const component = ship.visual?.effectBindings?.[Number(el.dataset.shipComponentLines)];
      if (!component) return;
      pathSet(component, el.dataset.componentPath, linesToArray(el.value));
      syncShipVisual(ship);
      setDirty();
      runValidation();
      renderIntegrity();
    });
  });

  root.querySelector("[data-add-ship-component]")?.addEventListener("click", () => {
    ship.visual ??= createDefaultShipVisual(shipId);
    ship.visual.effectBindings ??= [];
    const nextIndex = ship.visual.effectBindings.length + 1;
    const id = prompt("New component id", `component_${nextIndex}`);
    if (!id) return;
    if (ship.visual.effectBindings.some((component) => component.id === id)) {
      alert("Component ID already exists.");
      return;
    }
    ship.visual.effectBindings.push(createShipComponent({
      id,
      kind: "emissive_light",
      label: id,
      effectId: Object.keys(capsule.vfxDefs.effects || {})[0] || "aux_light_default",
      objectMatches: [],
      materialMatches: []
    }));
    syncShipVisual(ship);
    setDirty();
    renderShipVisualPage();
  });

  root.querySelectorAll("[data-delete-ship-component]").forEach((button) => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.deleteShipComponent);
      if (!confirm(`Delete component ${ship.visual?.effectBindings?.[index]?.id || index}?`)) return;
      ship.visual.effectBindings.splice(index, 1);
      syncShipVisual(ship);
      setDirty();
      renderShipVisualPage();
    });
  });
}

function linesToArray(value) {
  return String(value || "")
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean);
}

function ensureShipEditorShape(ship) {
  ship.visual = normalizeShipVisual(ship.id, ship.visual || {});
  syncShipVisual(ship);
  return ship;
}

function syncShipVisuals() {
  for (const ship of Object.values(capsule.shipDefs.ships || {})) syncShipVisual(ship);
}

function syncShipVisual(ship) {
  if (!ship?.visual) return;
  ship.visual.reflectionIntensity = Number(ship.visual.materials?.reflectionIntensity ?? ship.visual.reflectionIntensity ?? 0.32);
  ship.visual.highlightColor = ship.visual.highlightColor || firstHighlightColor(ship.visual) || "#ffffff";
  ship.visual.effectBindings = normalizeShipEffectBindings(ship.visual.effectBindings || []);
  ship.visual.materials ??= {};
  ship.visual.materials.highlights ??= {};
  ship.visual.materials.highlights.highlight_01 ??= {
    id: "highlight_01",
    label: "Highlight_01",
    materialName: "Highlight_01",
    defaultColor: ship.visual.highlightColor
  };
  ship.visual.materials.highlights.highlight_01.defaultColor = ship.visual.highlightColor;
}

function syncVfxDefs() {
  capsule.vfxDefs.effects = normalizeVfxEffects(capsule.vfxDefs.effects || {});
  capsule.vfxDefs.effects ??= {};
  for (const [id, effect] of Object.entries(capsule.vfxDefs.effects)) {
    effect.id = effect.id || id;
    syncVfxEffect(effect);
  }
}

function syncVfxEffect(effect) {
  if (!effect) return;
  effect.kind = effect.kind || "emissive_light";
  effect.label = effect.label || effect.id || "VFX";
  effect.settings = { ...DEFAULT_SHIP_LIGHT_SETTINGS, ...(effect.settings || {}) };
}

function buildShipVfxFromComponents(visual, effects) {
  const components = visual.effectBindings || [];
  const lightParts = components.map((component) => {
    const effect = effects[component.effectId] || {};
    const lightPart = {
      id: component.id,
      label: component.label || component.id,
      objectMatches: [...(component.target?.objectMatches || [])],
      settings: {
        ...(effect.settings || {}),
        ...(component.overrides || {})
      }
    };
    const materialMatches = [...(component.target?.materialMatches || [])];
    if (materialMatches.length) lightPart.materialMatches = materialMatches;
    return lightPart;
  });
  const engineComponent = components.find((component) => component.engineOutput) || components[0] || null;
  const defaultComponent = components.find((component) => component.defaultLight) || components.find((component) => component.kind === "head_light") || null;
  return {
    defaultLightType: defaultComponent?.id ?? null,
    engineOutput: {
      controlledLightType: engineComponent?.id || lightParts[0]?.id || null,
      value: 100,
      min: {
        emissiveIntensity: 0.2,
        glowSpriteOpacity: 0.04,
        pointIntensity: 0.05
      }
    },
    lightParts
  };
}

function addVfxEffect() {
  const id = prompt("New VFX id", `vfx_${Object.keys(capsule.vfxDefs.effects || {}).length + 1}`);
  if (!id) return;
  capsule.vfxDefs.effects ??= {};
  if (capsule.vfxDefs.effects[id]) {
    alert("VFX ID already exists.");
    return;
  }
  capsule.vfxDefs.effects[id] = {
    id,
    label: id,
    kind: "emissive_light",
    settings: { ...DEFAULT_SHIP_LIGHT_SETTINGS }
  };
  selected.vfx = id;
  syncVfxDefs();
  setDirty();
  renderVfxPage();
  renderShipVisualPage();
  runValidation();
  renderIntegrity();
}

function deleteVfxEffect(id) {
  if (!id || !capsule.vfxDefs.effects?.[id]) return;
  if (!confirm(`Delete VFX ${id}?`)) return;
  delete capsule.vfxDefs.effects[id];
  for (const ship of Object.values(capsule.shipDefs.ships || {})) {
    for (const binding of ship.visual?.effectBindings || []) {
      if (binding.effectId === id) binding.effectId = "";
    }
  }
  selected.vfx = Object.keys(capsule.vfxDefs.effects || {}).sort()[0] || null;
  setDirty();
  renderVfxPage();
  renderShipVisualPage();
  runValidation();
  renderIntegrity();
}

function addEntity(kind) {
  const cfg = entityConfig[kind];
  const collection = cfg.collection();
  const id = prompt(`New ${cfg.singular} id`);
  if (!id) return;
  if (collection[id]) {
    alert("ID already exists.");
    return;
  }
  collection[id] = cfg.make(id);
  if (kind === "weapons") syncItemDefinitionForCombat("weapon", collection[id]);
  if (kind === "shields") syncItemDefinitionForCombat("shield", collection[id]);
  if (kind === "equipment") syncItemDefinitionForCombat("equipment", collection[id]);
  if (kind === "ships") syncItemDefinitionForShip(collection[id]);
  selected[kind] = id;
  if (!cfg.editorOnly) {
    contentEntry(cfg.singular, id, "ko").name = id;
    contentEntry(cfg.singular, id, "en").name = id;
  }
  setDirty();
  rerender();
  setActiveTab(cfg.tab || kind);
}

function deleteEntity(kind, id) {
  const cfg = entityConfig[kind];
  const collection = cfg.collection();
  if (!collection[id]) return;
  if (!confirm(`Delete ${id}?`)) return;
  delete collection[id];
  if (!cfg.editorOnly) {
    const singular = cfg.singular;
    for (const lang of ["ko", "en"]) delete capsule.i18n.content?.[lang]?.[singular]?.[id];
  }
  if (kind === "ships") delete capsule.combatEditor.shipProfiles?.[id];
  selected[kind] = Object.keys(collection).sort()[0] || null;
  setDirty();
  rerender();
}
