<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Zero Integrated Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #0d0f10;
      --panel: #151819;
      --panel-2: #1b2021;
      --panel-3: #222829;
      --line: rgba(195, 210, 200, 0.16);
      --line-strong: rgba(195, 210, 200, 0.28);
      --text: #d9e3dd;
      --muted: #8b9b94;
      --quiet: #64716c;
      --accent: #44d7b6;
      --accent-2: #f4b35e;
      --danger: #f05d5e;
      --warn: #e9c46a;
      --info: #7cb7ff;
      --ok: #5dd39e;
      --field: #0f1213;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      font-size: 12px;
      overflow: hidden;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-3);
      color: var(--text);
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: #293031;
    }

    button:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .btn-primary {
      border-color: rgba(68, 215, 182, 0.42);
      background: rgba(68, 215, 182, 0.12);
      color: var(--accent);
    }

    .btn-warn {
      border-color: rgba(244, 179, 94, 0.42);
      background: rgba(244, 179, 94, 0.10);
      color: var(--accent-2);
    }

    .btn-danger {
      border-color: rgba(240, 93, 94, 0.42);
      background: rgba(240, 93, 94, 0.10);
      color: #ff9a9a;
    }

    .btn-small {
      height: 26px;
      padding: 0 8px;
      font-size: 11px;
    }

    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
      min-height: 30px;
      padding: 6px 8px;
      outline: none;
      width: 100%;
    }

    input[type="color"] {
      padding: 2px;
      min-height: 30px;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      min-height: 16px;
      accent-color: var(--accent);
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(68, 215, 182, 0.62);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.45;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }

    .app {
      display: grid;
      grid-template-rows: 84px 1fr;
      width: 100%;
      height: 100%;
    }

    .topbar {
      display: grid;
      grid-template-rows: 36px 48px;
      background: #111414;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 26px var(--shadow);
      z-index: 10;
    }

    .window-titlebar {
      display: grid;
      grid-template-columns: 260px 1fr auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 0 14px;
      border-bottom: 1px solid rgba(195, 210, 200, 0.08);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--accent);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-file {
      min-width: 120px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--quiet);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }

    .capsule-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .capsule-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 650;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      white-space: nowrap;
      font-size: 11px;
    }

    .pill.ok { color: var(--ok); border-color: rgba(93, 211, 158, 0.34); }
    .pill.warn { color: var(--warn); border-color: rgba(233, 196, 106, 0.36); }
    .pill.err { color: #ff9a9a; border-color: rgba(240, 93, 94, 0.42); }

    .command-bar {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
      overflow-x: auto;
      padding: 6px 10px;
      background: #151819;
    }

    .command-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 0 10px;
      border-right: 1px solid var(--line);
    }

    .command-group:first-child {
      padding-left: 0;
    }

    .command-spacer {
      flex: 1 1 auto;
      min-width: 0;
    }

    .command-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 10px;
      color: var(--quiet);
    }

    .workspace {
      display: grid;
      grid-template-columns: 210px 1fr;
      min-height: 0;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .tab-btn {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 38px;
      border-radius: 6px;
      background: transparent;
      text-align: left;
      color: var(--muted);
    }

    .tab-btn:hover {
      background: var(--panel-2);
    }

    .tab-btn.active {
      background: rgba(68, 215, 182, 0.10);
      border-color: rgba(68, 215, 182, 0.34);
      color: var(--text);
    }

    .tab-index {
      color: var(--quiet);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .tab-count {
      color: var(--quiet);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .content {
      min-width: 0;
      min-height: 0;
      background: var(--bg);
      overflow: hidden;
    }

    .tab-page {
      display: none;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .tab-page.active {
      display: block;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 46px;
      padding: 0 14px;
      background: #111414;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      font-size: 13px;
      font-weight: 760;
      color: var(--text);
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .map-shell {
      display: grid;
      grid-template-columns: 270px minmax(340px, 1fr) 330px;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .side {
      background: var(--panel);
      overflow: auto;
      min-height: 0;
    }

    .side.left {
      border-right: 1px solid var(--line);
    }

    .side.right {
      border-left: 1px solid var(--line);
    }

    .panel-block {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      margin-bottom: 8px;
      color: var(--quiet);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .stack {
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .row > * {
      min-width: 0;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .segmented button {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
    }

    .segmented button.active {
      background: rgba(68, 215, 182, 0.12);
      color: var(--accent);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 10px;
    }

    .metric {
      display: grid;
      gap: 2px;
    }

    .metric span {
      color: var(--quiet);
      font-size: 10px;
    }

    .metric b {
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .drop-zone {
      display: grid;
      place-items: center;
      min-height: 76px;
      border: 1px dashed rgba(68, 215, 182, 0.32);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      background: rgba(68, 215, 182, 0.04);
      text-align: center;
      line-height: 1.55;
    }

    .drop-zone.drag-over {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(68, 215, 182, 0.10);
    }

    .cluster-list {
      display: grid;
      gap: 4px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }

    .cluster-row {
      display: grid;
      grid-template-columns: 18px 30px 1fr auto;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      padding: 5px 7px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
    }

    .cluster-row input {
      width: 16px;
      height: 16px;
      min-height: 16px;
      cursor: pointer;
    }

    .cluster-row:hover {
      background: var(--panel-2);
    }

    .cluster-row.enabled {
      border-color: rgba(217, 227, 221, 0.24);
    }

    .cluster-row.active {
      border-color: rgba(217, 227, 221, 0.38);
      background: rgba(217, 227, 221, 0.08);
      color: var(--text);
    }

    .cluster-main {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .cluster-title,
    .cluster-sub {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cluster-title {
      color: var(--text);
      font-weight: 650;
    }

    .cluster-sub {
      color: var(--quiet);
      font-size: 10px;
    }

    .cluster-state {
      color: var(--quiet);
      font-size: 10px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #050606;
    }

    #three-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .map-hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(217, 227, 221, 0.56);
      pointer-events: none;
      font-size: 11px;
    }

    .map-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      background: rgba(13, 15, 16, 0.86);
      backdrop-filter: blur(8px);
      overflow-x: auto;
    }

    .map-footer > * {
      flex: 0 0 auto;
    }

    .coord-input {
      width: 58px;
      text-align: right;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 140px;
      color: var(--quiet);
      text-align: center;
      line-height: 1.6;
    }

    .entity-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .entity-list-panel {
      background: var(--panel);
      border-right: 1px solid var(--line);
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .entity-list {
      overflow: auto;
      padding: 8px;
      display: grid;
      align-content: start;
      gap: 4px;
    }

    .entity-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 44px;
      padding: 7px 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .entity-item:hover {
      background: var(--panel-2);
    }

    .entity-item.active {
      border-color: rgba(68, 215, 182, 0.34);
      background: rgba(68, 215, 182, 0.08);
      color: var(--text);
    }

    .entity-main {
      display: grid;
      gap: 2px;
      min-width: 0;
      text-align: left;
    }

    .entity-id {
      display: block;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entity-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--quiet);
      margin-top: 2px;
    }

    .entity-meta {
      color: var(--quiet);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .detail-panel {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--bg);
    }

    .form-wrap {
      max-width: 1180px;
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .form-section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .form-section h3 {
      margin: 0;
      min-height: 36px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 10px;
      padding: 12px;
    }

    .form-grid.two {
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }

    .form-grid.three {
      grid-template-columns: repeat(3, minmax(160px, 1fr));
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      color: var(--quiet);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .field.inline {
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .field.inline label {
      text-transform: none;
      letter-spacing: 0;
      font-size: 12px;
    }

    .json-error {
      color: #ff9a9a;
      font-size: 11px;
      min-height: 16px;
      padding: 0 12px 10px;
    }

    .asset-table, .issue-table {
      width: 100%;
      border-collapse: collapse;
    }

    .asset-table th, .asset-table td,
    .issue-table th, .issue-table td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }

    .asset-table th, .issue-table th {
      color: var(--quiet);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #111414;
    }

    .severity {
      display: inline-flex;
      justify-content: center;
      min-width: 64px;
      padding: 3px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .severity.error {
      color: #ffb2b2;
      background: rgba(240, 93, 94, 0.12);
      border: 1px solid rgba(240, 93, 94, 0.34);
    }

    .severity.warning {
      color: #ffe1a3;
      background: rgba(233, 196, 106, 0.12);
      border: 1px solid rgba(233, 196, 106, 0.34);
    }

    .severity.info {
      color: #b9d8ff;
      background: rgba(124, 183, 255, 0.12);
      border: 1px solid rgba(124, 183, 255, 0.34);
    }

    .mono {
      font-family: "Cascadia Mono", Consolas, monospace;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--line);
      flex: 0 0 auto;
    }

    @media (max-width: 1120px) {
      .window-titlebar {
        grid-template-columns: 1fr auto;
      }

      .capsule-strip {
        display: none;
      }

      .workspace {
        grid-template-columns: 176px 1fr;
      }

      .map-shell {
        grid-template-columns: 240px 1fr;
      }

      .side.right {
        display: none;
      }

      .form-grid,
      .form-grid.three,
      .form-grid.two {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
      }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-rows: auto 1fr;
      }

      .topbar {
        grid-template-rows: auto auto;
      }

      .window-titlebar {
        grid-template-columns: 1fr;
        align-items: start;
        gap: 6px;
        min-width: 0;
        padding: 8px 10px;
      }

      .command-bar {
        justify-content: flex-start;
        width: 100%;
        padding: 6px 10px;
      }

      .command-group {
        padding: 0 8px;
      }

      .project-file,
      .command-meta {
        display: none;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .nav {
        display: none;
      }

      .map-shell,
      .entity-layout {
        grid-template-columns: 1fr;
      }

      .side.left,
      .entity-list-panel {
        display: none;
      }

      .form-grid,
      .form-grid.three,
      .form-grid.two {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="window-titlebar">
        <div class="brand">
          <div class="brand-title">VOID ZERO</div>
          <div class="brand-sub">Integrated Editor</div>
        </div>
        <div class="capsule-strip">
          <span id="capsule-name" class="capsule-name">Untitled Project</span>
          <span id="capsule-version" class="pill">0.0.0</span>
          <span id="capsule-status" class="pill ok">Clean</span>
          <span id="validation-pill" class="pill ok">0 issues</span>
        </div>
        <span id="project-file-name" class="project-file">No file</span>
      </div>
      <div class="command-bar" role="toolbar" aria-label="Project file commands">
        <div class="command-group">
          <button id="btn-new-project">New Project</button>
          <button id="btn-open-project">Open</button>
          <button id="btn-save-project" class="btn-primary">Save</button>
        </div>
        <div class="command-group">
          <button id="btn-export-all" class="btn-warn">Export Game Data</button>
        </div>
        <div class="command-spacer"></div>
        <div class="command-meta">
          <span class="pill">Project .ged</span>
        </div>
      </div>
    </header>

    <div class="workspace">
      <nav class="nav" id="tab-nav">
        <button class="tab-btn active" data-tab="map"><span class="tab-index">01</span><span>Galaxy Map</span><span class="tab-count" id="count-map">0</span></button>
        <button class="tab-btn" data-tab="sectors"><span class="tab-index">02</span><span>Sectors</span><span class="tab-count" id="count-sectors">0</span></button>
        <button class="tab-btn" data-tab="resources"><span class="tab-index">03</span><span>Resources</span><span class="tab-count" id="count-resources">0</span></button>
        <button class="tab-btn" data-tab="items"><span class="tab-index">04</span><span>Items</span><span class="tab-count" id="count-items">0</span></button>
        <button class="tab-btn" data-tab="buildings"><span class="tab-index">05</span><span>Buildings</span><span class="tab-count" id="count-buildings">0</span></button>
        <button class="tab-btn" data-tab="ships"><span class="tab-index">06</span><span>Ships</span><span class="tab-count" id="count-ships">0</span></button>
        <button class="tab-btn" data-tab="ship-visuals"><span class="tab-index">07</span><span>Ship Visuals</span><span class="tab-count" id="count-ship-visuals">0</span></button>
        <button class="tab-btn" data-tab="vfx"><span class="tab-index">08</span><span>VFX</span><span class="tab-count" id="count-vfx">0</span></button>
        <button class="tab-btn" data-tab="assets"><span class="tab-index">09</span><span>Assets</span><span class="tab-count" id="count-assets">0</span></button>
        <button class="tab-btn" data-tab="integrity"><span class="tab-index">10</span><span>Integrity</span><span class="tab-count" id="count-integrity">0</span></button>
      </nav>

      <main class="content">
        <section id="tab-map" class="tab-page active">
          <div class="map-shell">
            <aside class="side left">
              <div class="panel-block">

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const clone = (value) => JSON.parse(JSON.stringify(value));
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

const FILES = {
  assetRegistry: "asset_registry.json",
  itemDefs: "item_defs.json",
  resourceDefs: "resource_defs.json",
  buildingDefs: "building_defs.json",
  sectorDefs: "sector_defs.json",
  shipDefs: "ship_defs.json",
  vfxDefs: "vfx_defs.json",
  i18n: "i18n.json",
  chunkMap: "chunk_map.gmapdata"
};
const GAME_GMAP_FILE = "galaxyMapData.gmap";
const PROJECT_FORMAT = "void-zero-galaxy-editor-save";
const PROJECT_VERSION = 1;
const PROJECT_SAVE_COUNTER_KEY = "void-zero-galaxy-editor-save-counter";

const RESOURCE_CATEGORIES = ["hydrite_mineral", "mineral", "gas"];
const ITEM_TYPES = ["hydrite_mineral", "mineral", "gas"];
const NODE_TYPES = ["PERMANENT", "DECAYING"];
const PLACEMENT_TYPES = ["sector_anchor", "free_space", "resource_node"];
const PRODUCTION_KINDS = ["NONE", "SELF", "RESOURCE_EXTRACTOR", "FACTORY"];
const BUILDING_SIZES = ["EX", "L", "M", "S"];
const BUILDING_CATEGORIES = [
  "defense_turret", "factory", "habitation", "headquarters", "hyperdrive_energy",
  "outpost", "power_plant", "resource_production", "shipyard", "trade_port"
];

const SECTOR_COLORS = ["#ff6b35", "#ffd450", "#ff4466", "#63d2ff", "#aa88ff", "#ff9944", "#ffee44", "#88ddff", "#44dd88", "#cc88cc"];
const DEFAULT_SHIP_ID = "ship_01";
const DEFAULT_SHIP_LIGHT_SETTINGS = {
  color: "#9b9bff",
  emissiveIntensity: 3,
  lightRangeScale: 2,
  minLightRange: 0.52,
  maxLightRange: 1.45,
  glowSpriteSpreadScale: 0.8,
  glowSpriteOpacity: 0.28,
  pointLightEnabled: false,
  pointIntensity: 0.2,
  pointRangeScale: 0.2
};
const SHIP_COMPONENT_KINDS = ["engine", "head_light", "emissive_light"];
const VFX_EFFECT_KINDS = ["emissive_light"];

function makeEmptyI18n() {
  const buckets = { item: {}, resource: {}, building: {}, sector: {}, ship: {} };
  return {
    version: 1,
    system: { ko: {}, en: {} },
    content: { ko: clone(buckets), en: clone(buckets) }
  };
}

function makeEmptyCapsule() {
  return {
    assetRegistry: { version: 1, models: {}, audio: {} },
    itemDefs: { version: 1, items: {} },
    resourceDefs: { version: 1, resources: {} },
    buildingDefs: { version: 1, buildings: {} },
    sectorDefs: { version: 1, sectors: {} },
    shipDefs: { version: 1, ships: {} },
    vfxDefs: { version: 1, effects: {} },
    i18n: makeEmptyI18n(),
    chunkMap: { version: 2, sourceGmap: "", clusters: {}, chunks: {} }
  };
}

function makeShip(id, highlightColor) {
  const specs = {
    maxSpeed: 100,
    minSpeed: -20,
    accelerationRate: 24,
    decelerationRate: 32,
    throttleAdjustRate: 36,
    arrivalRadius: 10,
    deactivationCoastDuration: 600,
    pitchRate: 1.45,
    yawRate: 1.55,
    rollRate: 1.8,
    strafeRate: 45,
    verticalRate: 45
  };
  const hyperdriveSpecs = {
    cooldownDuration: 5,
    warpEntryDuration: 0.6,
    warpExitDuration: 0.6,
    warpMinFlightDuration: 5,
    warpFlightSpeed: 4000
  };
  return {
    id,
    labelKey: `ui.settings.gameplay.${id}`,
    fallbackLabel: id,
    specs,
    hyperdriveSpecs,
    visual: createDefaultShipVisual(id, { highlightColor })
  };
}

function createDefaultShipVisual(id, visual = {}) {
  const modelId = visual.modelId || id;
  const reflectionIntensity = Number(visual.materials?.reflectionIntensity ?? visual.reflectionIntensity ?? 0.32);
  const highlightColor = normalizeColorString(visual.highlightColor || firstHighlightColor(visual) || (id === "ship_02" ? "#286d4d" : "#ff97c2"));
  const bindingColor = "#9b9bff";
  const effectBindings = Array.isArray(visual.effectBindings)
    ? normalizeShipEffectBindings(visual.effectBindings)
    : createDefaultShipComponents(id, bindingColor);

  return {
    modelId,
    reflectionIntensity,
    highlightColor,
    effectBindings,
    materials: {
      reflectionIntensity,
      emissiveSurface: {
        materialName: "EmissiveMTL_light",
        fallbackColor: "#ffffff"
      },
      highlights: {
        highlight_01: {
          id: "highlight_01",
          label: "Highlight_01",
          materialName: "Highlight_01",
          defaultColor: highlightColor
        }
      }
    }
  };
}

function createDefaultShipComponents(id, bindingColor = "#9b9bff") {
  const engineId = id === "ship_02" ? "vfx_light_02_engine_001" : "vfx_light_engine_001";
  const components = [
    createShipComponent({
      id: engineId,
      kind: "engine",
      label: `EmissivePlate_${id}.001`,
      effectId: "engine_light_default",
      objectMatches: [`EmissivePlate_${id}.001`],
      engineOutput: true,
      overrides: { color: bindingColor }
    })
  ];

  if (id !== "ship_02") {
    components.push(createShipComponent({
      id: "vfx_light_head_001",
      kind: "head_light",
      label: "EmissivePlate_ship_01.002",
      effectId: "head_light_default",
      objectMatches: ["EmissivePlate_ship_01.002"],
      defaultLight: true
    }));
  }

  const auxPrefix = id === "ship_02" ? "vfx_light_02_aux_" : "vfx_light_aux_";
  const auxLabels = id === "ship_02" ? ["002", "003", "004", "005", "006", "007"] : ["003", "004", "005", "006"];
  for (const label of auxLabels) {
    components.push(createShipComponent({
      id: `${auxPrefix}${label}`,
      kind: "emissive_light",
      label: `EmissivePlate_${id}.${label}`,
      effectId: "aux_light_default",
      objectMatches: [`EmissivePlate_${id}.${label}`],
      overrides: { color: bindingColor }
    }));
  }

  return components;
}

function createShipComponent({
  id,
  kind = "emissive_light",
  label = id,
  effectId = "aux_light_default",
  objectMatches = [],
  materialMatches = [],
  engineOutput = false,
  defaultLight = false,
  overrides = {}
}) {
  return {
    id,
    kind,
    label,
    effectId,
    target: {
      objectMatches: [...objectMatches],
      materialMatches: [...materialMatches]
    },
    engineOutput,
    defaultLight,
    overrides: { ...overrides }
  };
}

function firstHighlightColor(visual = {}) {
  const first = Object.values(visual.materials?.highlights || {})[0];
  return first?.defaultColor || null;
}

function normalizeColorString(value) {
  if (typeof value === "string") return value;
  const color = Number(value);
  if (!Number.isFinite(color)) return "#ffffff";
  return `#${Math.max(0, Math.min(0xffffff, color)).toString(16).padStart(6, "0")}`;
}

function makeEmptySelection() {
  return { sectors: null, resources: null, items: null, buildings: null, ships: null, vfx: null };
}

let capsule = makeEmptyCapsule();
let dirty = false;
let activeTab = "map";
let selected = makeEmptySelection();
let issues = [];
let projectFileName = "";

const entityConfig = {
  sectors: { label: "Sectors", singular: "sector", collection: () => capsule.sectorDefs.sectors, make: makeNewSector, render: renderSectorDetail },
  resources: { label: "Resources", singular: "resource", collection: () => capsule.resourceDefs.resources, make: makeNewResource, render: renderResourceDetail },
  items: { label: "Items", singular: "item", collection: () => capsule.itemDefs.items, make: makeNewItem, render: renderItemDetail },
  buildings: { label: "Buildings", singular: "building", collection: () => capsule.buildingDefs.buildings, make: makeNewBuilding, render: renderBuildingDetail },
  ships: { label: "Ships", singular: "ship", collection: () => capsule.shipDefs.ships, make: makeNewShip, render: renderShipDetail }
};

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, "&#96;");
}

function toNumber(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function pathGet(obj, path) {
  return path.split(".").reduce((cur, part) => cur?.[part], obj);
}

function pathSet(obj, path, value) {
  const parts = path.split(".");
  let cur = obj;
  while (parts.length > 1) {
    const part = parts.shift();
    if (!cur[part] || typeof cur[part] !== "object") cur[part] = {};
    cur = cur[part];
  }
  cur[parts[0]] = value;
}

function options(values, current) {
  return values.map((value) => `<option value="${escapeAttr(value)}" ${value === current ? "selected" : ""}>${escapeHtml(value)}</option>`).join("");
}

function idOptions(collection, current, emptyLabel = null) {
  const ids = Object.keys(collection).sort();
  const rows = emptyLabel ? [`<option value="">${escapeHtml(emptyLabel)}</option>`] : [];
  rows.push(...ids.map((id) => `<option value="${escapeAttr(id)}" ${id === current ? "selected" : ""}>${escapeHtml(id)}</option>`));
  return rows.join("");
}

function field(label, html) {
  return `<div class="field"><label>${escapeHtml(label)}</label>${html}</div>`;
}

function input(path, value, type = "text", extra = "") {
  return `<input type="${type}" data-path="${escapeAttr(path)}" value="${escapeAttr(value ?? "")}" ${extra} />`;
}

function numberInput(path, value, step = "1", extra = "") {
  return input(path, value ?? 0, "number", `step="${step}" ${extra}`);
}

function selectInput(path, value, values, extra = "") {
  return `<select data-path="${escapeAttr(path)}" ${extra}>${options(values, value)}</select>`;
}

function checkboxInput(path, checked) {
  return `<label class="field inline"><input type="checkbox" data-path="${escapeAttr(path)}" ${checked ? "checked" : ""} /><span>Enabled</span></label>`;
}

function jsonField(label, path, value) {
  return `<div class="form-section"><h3>${escapeHtml(label)}</h3><textarea data-json-path="${escapeAttr(path)}">${escapeHtml(JSON.stringify(value ?? {}, null, 2))}</textarea><div class="json-error" data-json-error="${escapeAttr(path)}"></div></div>`;
}

function i18nFields(kind, id) {
  const ko = contentEntry(kind, id, "ko");
  const en = contentEntry(kind, id, "en");
  return `
    <div class="form-section">
      <h3>I18n Content</h3>
      <div class="form-grid two">
        ${field("KO Name", `<input data-i18n-lang="ko" data-i18n-field="name" value="${escapeAttr(ko.name ?? "")}" />`)}
        ${field("EN Name", `<input data-i18n-lang="en" data-i18n-field="name" value="${escapeAttr(en.name ?? "")}" />`)}
        ${field(kind === "sector" ? "KO Theme" : "KO Description", `<textarea data-i18n-lang="ko" data-i18n-field="${kind === "sector" ? "theme" : "description"}">${escapeHtml(ko[kind === "sector" ? "theme" : "description"] ?? "")}</textarea>`)}
        ${field(kind === "sector" ? "EN Theme" : "EN Description", `<textarea data-i18n-lang="en" data-i18n-field="${kind === "sector" ? "theme" : "description"}">${escapeHtml(en[kind === "sector" ? "theme" : "description"] ?? "")}</textarea>`)}
      </div>
    </div>
  `;
}

function contentEntry(kind, id, lang) {
  capsule.i18n.content ??= {};
  capsule.i18n.content[lang] ??= {};
  capsule.i18n.content[lang][kind] ??= {};
  capsule.i18n.content[lang][kind][id] ??= kind === "sector" ? { name: id, theme: "" } : { name: id, description: "" };
  return capsule.i18n.content[lang][kind][id];
}

function entityName(kind, id) {
  return contentEntry(kind, id, "en").name || contentEntry(kind, id, "ko").name || id;
}

function setDirty(value = true) {
  dirty = value;
  updateHeader();
}

function updateHeader() {
  $("#capsule-name").textContent = projectFileName ? projectFileName.replace(/\.ged$/i, "") : "Untitled Project";
  $("#capsule-version").textContent = `GED v${PROJECT_VERSION}`;
  $("#project-file-name").textContent = projectFileName || "No file";
  $("#project-file-name").title = projectFileName || "";
  const status = $("#capsule-status");
  status.textContent = dirty ? "Dirty" : "Clean";
  status.className = `pill ${dirty ? "warn" : "ok"}`;
  const err = issues.filter((i) => i.level === "ERROR").length;
  const warn = issues.filter((i) => i.level === "WARNING").length;
  const pill = $("#validation-pill");
  pill.textContent = err ? `${err} errors` : warn ? `${warn} warnings` : `${issues.length} issues`;
  pill.className = `pill ${err ? "err" : warn ? "warn" : "ok"}`;
}

function countValues() {
  $("#count-map").textContent = Object.keys(capsule.chunkMap.chunks || {}).length;
  $("#count-sectors").textContent = Object.keys(capsule.sectorDefs.sectors || {}).length;
  $("#count-resources").textContent = Object.keys(capsule.resourceDefs.resources || {}).length;
  $("#count-items").textContent = Object.keys(capsule.itemDefs.items || {}).length;
  $("#count-buildings").textContent = Object.keys(capsule.buildingDefs.buildings || {}).length;
  $("#count-ships").textContent = Object.keys(capsule.shipDefs.ships || {}).length;
  $("#count-ship-visuals").textContent = Object.keys(capsule.shipDefs.ships || {}).length;
  $("#count-vfx").textContent = Object.keys(capsule.vfxDefs.effects || {}).length;
  const refs = collectAssetRefs();
  $("#count-assets").textContent = refs.models.size + refs.audio.size;
  $("#count-integrity").textContent = issues.length;
}

function rerender() {
  for (const kind of Object.keys(entityConfig)) renderEntityPage(kind);
  renderShipVisualPage();
  renderVfxPage();
  renderAssets();
  runValidation();
  renderIntegrity();
  refreshMapStats();
  renderChunkPanel(selectedKey);
  updateMapColors();
  countValues();
  updateHeader();
}

function setActiveTab(tab) {
  activeTab = $(`#tab-${tab}`) ? tab : "map";
  $$(".tab-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === activeTab));
  $$(".tab-page").forEach((page) => page.classList.toggle("active", page.id === `tab-${activeTab}`));
  if (activeTab === "map") resizeRenderer();
  if (activeTab === "ship-visuals") renderShipVisualPage();
  if (activeTab === "vfx") renderVfxPage();
}

$("#tab-nav").addEventListener("click", (event) => {
  const btn = event.target.closest(".tab-btn");
  if (btn) setActiveTab(btn.dataset.tab);
});

function renderEntityPage(kind) {
  const cfg = entityConfig[kind];
  const root = $(`#tab-${kind}`);
  const collection = cfg.collection();
  const ids = Object.keys(collection).sort();
  if (!selected[kind] || !collection[selected[kind]]) selected[kind] = ids[0] || null;
  root.innerHTML = `
    <div class="entity-layout">
      <aside class="entity-list-panel">
        <div class="section-head">
          <div class="section-title">${escapeHtml(cfg.label)}</div>
          <button class="btn-small btn-primary" data-add-kind="${kind}">Add</button>
        </div>
        <div class="panel-block"><input type="search" data-search-kind="${kind}" placeholder="Filter" /></div>
        <div class="entity-list" data-list-kind="${kind}">
          ${ids.map((id) => entityListItem(kind, id, collection[id])).join("")}
        </div>
      </aside>
      <main class="detail-panel" id="${kind}-detail"></main>
    </div>
  `;
  const detail = $(`#${kind}-detail`);
  if (!selected[kind]) {
    detail.innerHTML = `<div class="empty-state">No ${escapeHtml(cfg.singular)} selected</div>`;
  } else {
    cfg.render(detail, selected[kind], collection[selected[kind]]);
  }
}

function renderShipVisualPage() {
  const root = $("#tab-ship-visuals");
  const collection = capsule.shipDefs.ships || {};
  const ids = Object.keys(collection).sort();
  if (!selected.ships || !collection[selected.ships]) selected.ships = ids[0] || null;
  root.innerHTML = `
    <div class="entity-layout">
      <aside class="entity-list-panel">
        <div class="section-head">
          <div class="section-title">Ship Visuals</div>
        </div>
        <div class="panel-block"><input type="search" data-search-kind="ship-visuals" placeholder="Filter" /></div>
        <div class="entity-list" data-list-kind="ship-visuals">
          ${ids.map((id) => shipVisualListItem(id, collection[id])).join("")}
        </div>
      </aside>
      <main class="detail-panel" id="ship-visual-detail"></main>
    </div>
  `;
  const detail = $("#ship-visual-detail");
  if (!selected.ships) {
    detail.innerHTML = `<div class="empty-state">No ship selected</div>`;
  } else {
    renderShipVisualDetail(detail, selected.ships, collection[selected.ships]);
  }
}

function renderVfxPage() {
  const root = $("#tab-vfx");
  const effects = capsule.vfxDefs.effects || {};
  const ids = Object.keys(effects).sort();
  if (!selected.vfx || !effects[selected.vfx]) selected.vfx = ids[0] || null;
  root.innerHTML = `
    <div class="entity-layout">
      <aside class="entity-list-panel">
        <div class="section-head">
          <div class="section-title">VFX</div>
          <button class="btn-small btn-primary" data-add-vfx>Add</button>
        </div>
        <div class="panel-block"><input type="search" data-search-kind="vfx" placeholder="Filter" /></div>
        <div class="entity-list" data-list-kind="vfx">
          ${ids.map((id) => vfxListItem(id, effects[id])).join("")}
        </div>
      </aside>
      <main class="detail-panel" id="vfx-detail"></main>
    </div>
  `;
  const detail = $("#vfx-detail");
  if (!selected.vfx) {
    detail.innerHTML = `<div class="empty-state">No VFX selected</div>`;
  } else {
    renderVfxDetail(detail, selected.vfx, effects[selected.vfx]);
  }
}

function entityListItem(kind, id, entity) {
  const cfg = entityConfig[kind];
  const meta = entity.type || entity.nodeType || entity.category || entity.theme || entity.size || "";
  return `
    <button class="entity-item ${selected[kind] === id ? "active" : ""}" data-select-kind="${kind}" data-id="${escapeAttr(id)}">
      <span class="entity-main">
        <span class="entity-id">${escapeHtml(id)}</span>
        <span class="entity-name">${escapeHtml(entityName(cfg.singular, id))}</span>
      </span>
      <span class="entity-meta">${escapeHtml(meta)}</span>
    </button>
  `;
}

function vfxListItem(id, effect) {
  return `
    <button class="entity-item ${selected.vfx === id ? "active" : ""}" data-select-vfx="${escapeAttr(id)}">
      <span class="entity-main">
        <span class="entity-id">${escapeHtml(id)}</span>
        <span class="entity-name">${escapeHtml(effect.label || id)}</span>
      </span>
      <span class="entity-meta">${escapeHtml(effect.kind || "vfx")}</span>
    </button>
  `;
}

function shipVisualListItem(id, ship) {
  const visual = ship.visual || {};
  const meta = visual.modelId || "";
  return `
    <button class="entity-item ${selected.ships === id ? "active" : ""}" data-select-ship-visual="${escapeAttr(id)}">

document.addEventListener("click", (event) => {
  const vfxSelectBtn = event.target.closest("[data-select-vfx]");
  if (vfxSelectBtn) {
    selected.vfx = vfxSelectBtn.dataset.selectVfx;
    renderVfxPage();
    return;
  }
  const addVfxBtn = event.target.closest("[data-add-vfx]");
  if (addVfxBtn) {
    addVfxEffect();
    return;
  }
  const deleteVfxBtn = event.target.closest("[data-delete-vfx]");
  if (deleteVfxBtn) {
    deleteVfxEffect(deleteVfxBtn.dataset.deleteVfx);
    return;
  }
  const visualSelectBtn = event.target.closest("[data-select-ship-visual]");
  if (visualSelectBtn) {
    selected.ships = visualSelectBtn.dataset.selectShipVisual;
    renderShipVisualPage();
    return;
  }
  const selectBtn = event.target.closest("[data-select-kind]");
  if (selectBtn) {
    selected[selectBtn.dataset.selectKind] = selectBtn.dataset.id;
    renderEntityPage(selectBtn.dataset.selectKind);
    if (selectBtn.dataset.selectKind === "ships") renderShipVisualPage();
    return;
  }
  const addBtn = event.target.closest("[data-add-kind]");
  if (addBtn) {
    addEntity(addBtn.dataset.addKind);
    return;
  }
  const deleteBtn = event.target.closest("[data-delete-kind]");
  if (deleteBtn) {
    deleteEntity(deleteBtn.dataset.deleteKind, deleteBtn.dataset.id);
  }
});

document.addEventListener("input", (event) => {
  const search = event.target.closest("[data-search-kind]");
  if (search) {
    const kind = search.dataset.searchKind;
    const term = search.value.toLowerCase();
    $$(`[data-list-kind="${kind}"] .entity-item`).forEach((item) => {
      item.style.display = item.textContent.toLowerCase().includes(term) ? "" : "none";
    });
  }
});

function bindDetail(detail, kind, id, obj, rerenderOnChange = false) {
  const cfg = entityConfig[kind];
  detail.querySelectorAll("[data-path]").forEach((el) => {
    const eventName = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(eventName, () => {
      let value = el.type === "checkbox" ? el.checked : el.value;
      if (el.type === "number") value = toNumber(value);
      pathSet(obj, el.dataset.path, value);
      if (el.dataset.normalize === "int") pathSet(obj, el.dataset.path, Math.round(toNumber(value)));
      if (el.dataset.nullable === "true" && el.value === "") pathSet(obj, el.dataset.path, null);
      setDirty();
      if (rerenderOnChange || el.dataset.rerender === "true") {
        renderEntityPage(kind);
      } else {
        runValidation();
        renderIntegrity();
        countValues();
        updateMapColors();
      }
    });
  });
  detail.querySelectorAll("[data-json-path]").forEach((el) => {
    el.addEventListener("input", () => {
      const error = detail.querySelector(`[data-json-error="${CSS.escape(el.dataset.jsonPath)}"]`);
      try {
        const value = JSON.parse(el.value || "null");
        pathSet(obj, el.dataset.jsonPath, value);
        if (error) error.textContent = "";
        setDirty();
        runValidation();
        renderIntegrity();
      } catch (err) {
        if (error) error.textContent = err.message;
      }
    });
  });
  detail.querySelectorAll("[data-i18n-lang]").forEach((el) => {
    el.addEventListener("input", () => {
      contentEntry(cfg.singular, id, el.dataset.i18nLang)[el.dataset.i18nField] = el.value;
      setDirty();
      runValidation();
      renderIntegrity();
      const activeItem = detail.closest(".entity-layout")?.querySelector(`.entity-item.active .entity-name`);
      if (activeItem) activeItem.textContent = entityName(cfg.singular, id);
    });
  });
}

function bindShipBindingControls(root, shipId, ship) {
  root.querySelectorAll("[data-ship-component]").forEach((el) => {
    const eventName = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(eventName, () => {
      const component = ship.visual?.effectBindings?.[Number(el.dataset.shipComponent)];
      if (!component) return;
      let value = el.type === "checkbox" ? el.checked : el.value;
      if (el.type === "number") value = toNumber(value);
      pathSet(component, el.dataset.componentPath, value);
      if (el.dataset.componentPath === "engineOutput" && value === true) {
        ship.visual.effectBindings.forEach((item) => { if (item !== component) item.engineOutput = false; });
      }
      if (el.dataset.componentPath === "defaultLight" && value === true) {
        ship.visual.effectBindings.forEach((item) => { if (item !== component) item.defaultLight = false; });
      }
      syncShipVisual(ship);
      setDirty();
      runValidation();
      renderIntegrity();
    });
  });

  root.querySelectorAll("[data-ship-component-lines]").forEach((el) => {
    el.addEventListener("input", () => {
      const component = ship.visual?.effectBindings?.[Number(el.dataset.shipComponentLines)];
      if (!component) return;
      pathSet(component, el.dataset.componentPath, linesToArray(el.value));
      syncShipVisual(ship);
      setDirty();
      runValidation();
      renderIntegrity();
    });
  });

  root.querySelector("[data-add-ship-component]")?.addEventListener("click", () => {
    ship.visual ??= createDefaultShipVisual(shipId);
    ship.visual.effectBindings ??= [];
    const nextIndex = ship.visual.effectBindings.length + 1;
    const id = prompt("New component id", `component_${nextIndex}`);
    if (!id) return;
    if (ship.visual.effectBindings.some((component) => component.id === id)) {
      alert("Component ID already exists.");
      return;
    }
    ship.visual.effectBindings.push(createShipComponent({
      id,
      kind: "emissive_light",
      label: id,
      effectId: Object.keys(capsule.vfxDefs.effects || {})[0] || "aux_light_default",
      objectMatches: [],
      materialMatches: []
    }));
    syncShipVisual(ship);
    setDirty();
    renderShipVisualPage();
  });

  root.querySelectorAll("[data-delete-ship-component]").forEach((button) => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.deleteShipComponent);
      if (!confirm(`Delete component ${ship.visual?.effectBindings?.[index]?.id || index}?`)) return;
      ship.visual.effectBindings.splice(index, 1);
      syncShipVisual(ship);
      setDirty();
      renderShipVisualPage();
    });
  });
}

function linesToArray(value) {
  return String(value || "")
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean);
}

function ensureShipEditorShape(ship) {
  ship.visual = normalizeShipVisual(ship.id, ship.visual || {});
  syncShipVisual(ship);
  return ship;
}

function syncShipVisuals() {
  for (const ship of Object.values(capsule.shipDefs.ships || {})) syncShipVisual(ship);
}

function syncShipVisual(ship) {
  if (!ship?.visual) return;
  ship.visual.reflectionIntensity = Number(ship.visual.materials?.reflectionIntensity ?? ship.visual.reflectionIntensity ?? 0.32);
  ship.visual.highlightColor = ship.visual.highlightColor || firstHighlightColor(ship.visual) || "#ffffff";
  ship.visual.effectBindings = normalizeShipEffectBindings(ship.visual.effectBindings || []);
  ship.visual.materials ??= {};
  ship.visual.materials.highlights ??= {};
  ship.visual.materials.highlights.highlight_01 ??= {
    id: "highlight_01",
    label: "Highlight_01",
    materialName: "Highlight_01",
    defaultColor: ship.visual.highlightColor
  };
  ship.visual.materials.highlights.highlight_01.defaultColor = ship.visual.highlightColor;
}

function syncVfxDefs() {
  capsule.vfxDefs.effects = normalizeVfxEffects(capsule.vfxDefs.effects || {});
  capsule.vfxDefs.effects ??= {};
  for (const [id, effect] of Object.entries(capsule.vfxDefs.effects)) {
    effect.id = effect.id || id;
    syncVfxEffect(effect);
  }
}

function syncVfxEffect(effect) {
  if (!effect) return;
  effect.kind = effect.kind || "emissive_light";
  effect.label = effect.label || effect.id || "VFX";
  effect.settings = { ...DEFAULT_SHIP_LIGHT_SETTINGS, ...(effect.settings || {}) };
}

function buildShipVfxFromComponents(visual, effects) {
  const components = visual.effectBindings || [];
  const lightParts = components.map((component) => {
    const effect = effects[component.effectId] || {};
    const lightPart = {
      id: component.id,
      label: component.label || component.id,
      objectMatches: [...(component.target?.objectMatches || [])],
      settings: {
        ...(effect.settings || {}),
        ...(component.overrides || {})
      }
    };
    const materialMatches = [...(component.target?.materialMatches || [])];
    if (materialMatches.length) lightPart.materialMatches = materialMatches;
    return lightPart;
  });
  const engineComponent = components.find((component) => component.engineOutput) || components[0] || null;
  const defaultComponent = components.find((component) => component.defaultLight) || components.find((component) => component.kind === "head_light") || null;
  return {
    defaultLightType: defaultComponent?.id ?? null,
    engineOutput: {
      controlledLightType: engineComponent?.id || lightParts[0]?.id || null,
      value: 100,
      min: {
        emissiveIntensity: 0.2,
        glowSpriteOpacity: 0.04,
        pointIntensity: 0.05
      }
    },
    lightParts
  };
}

function addVfxEffect() {
  const id = prompt("New VFX id", `vfx_${Object.keys(capsule.vfxDefs.effects || {}).length + 1}`);
  if (!id) return;
  capsule.vfxDefs.effects ??= {};
  if (capsule.vfxDefs.effects[id]) {
    alert("VFX ID already exists.");
    return;
  }
  capsule.vfxDefs.effects[id] = {
    id,
    label: id,
    kind: "emissive_light",
    settings: { ...DEFAULT_SHIP_LIGHT_SETTINGS }
  };
  selected.vfx = id;
  syncVfxDefs();
  setDirty();
  renderVfxPage();
  renderShipVisualPage();
  runValidation();
  renderIntegrity();
}

function deleteVfxEffect(id) {
  if (!id || !capsule.vfxDefs.effects?.[id]) return;

  delete capsule.vfxDefs.effects[id];
  for (const ship of Object.values(capsule.shipDefs.ships || {})) {
    for (const binding of ship.visual?.effectBindings || []) {

  selected.vfx = Object.keys(capsule.vfxDefs.effects || {}).sort()[0] || null;

  renderIntegrity();
}

function collectAssetRefs() {
  const models = new Set();
  const audio = new Set();
  for (const ship of Object.values(capsule.shipDefs.ships || {})) if (ship.visual?.modelId) models.add(ship.visual.modelId);
  for (const res of Object.values(capsule.resourceDefs.resources || {})) if (res.visual?.modelId) models.add(res.visual.modelId);
  for (const b of Object.values(capsule.buildingDefs.buildings || {})) if (b.visual?.modelId) models.add(b.visual.modelId);
  for (const sector of Object.values(capsule.sectorDefs.sectors || {})) if (sector.themeMusicId) audio.add(sector.themeMusicId);
  return { models, audio };
}

function renderAssets() {
  const refs = collectAssetRefs();

function assetTable(kind, ids, refs) {

  return `<table class="asset-table"><thead><tr><th>ID</th><th>Path</th><th>Status</th></tr></thead><tbody>

      const path = capsule.assetRegistry[kind]?.[id] || "";
      const referenced = refs.has(id);
      const status = !referenced ? "Unused" : path ? "OK" : "Missing";
      return `<tr><td class="mono">${escapeHtml(id)}</td><td><input data-asset-kind="${kind}" data-asset-id="${escapeAttr(id)}" value="${escapeAttr(path)}" /></td><td>${escapeHtml(status)}</td></tr>`;

}

function runValidation() {
  issues = [];
  const sectors = capsule.sectorDefs.sectors || {};
  const resources = capsule.resourceDefs.resources || {};
  const items = capsule.itemDefs.items || {};
  const buildings = capsule.buildingDefs.buildings || {};
  const ships = capsule.shipDefs.ships || {};
  const vfxEffects = capsule.vfxDefs.effects || {};
  if (!gmapBuffer) addIssue("WARNING", "gmap", `${GAME_GMAP_FILE} is not loaded for game data output`);
  if (capsule.chunkMap.sourceGmap && capsule.chunkMap.sourceGmap !== GAME_GMAP_FILE) {
    addIssue("WARNING", "chunk_map", `sourceGmap will be exported as ${GAME_GMAP_FILE}`);
  }
  if (gmapBuffer && !enabledClusterCount()) addIssue("WARNING", "chunk_map", "No clusters are enabled for game data output");
  const chunkSectorOwners = new Map();
  for (const [key, ann] of Object.entries(capsule.chunkMap.chunks || {})) {
    if (ann.sectorId) {
      if (!sectors[ann.sectorId]) addIssue("ERROR", "chunk_map", `${key} references missing sector ${ann.sectorId}`);
      if (chunkSectorOwners.has(ann.sectorId)) addIssue("ERROR", "chunk_map", `${ann.sectorId} is assigned to multiple chunks (${chunkSectorOwners.get(ann.sectorId)}, ${key})`);
      chunkSectorOwners.set(ann.sectorId, key);
    }
    for (const resId of Object.keys(ann.resourceAmounts || {})) {
      if (!resources[resId]) addIssue("ERROR", "chunk_map", `${key} references missing resource ${resId}`);
    }
  }
  for (const [id, res] of Object.entries(resources)) {
    if (!items[res.producesItemId]) addIssue("ERROR", "resource_defs", `${id} produces missing item ${res.producesItemId}`);
    const allocated = resourceAllocated(id);
    if (allocated > Number(res.totalCapacity || 0)) addIssue("INFO", "resource_defs", `${id} allocated ${allocated} exceeds totalCapacity ${res.totalCapacity}`);
  }
  for (const [id, sector] of Object.entries(sectors)) {
    for (const entry of sector.initialBuildings || []) if (!buildings[entry.building_id]) addIssue("ERROR", "sector_defs", `${id} initialBuildings references ${entry.building_id}`);
    for (const entry of sector.initialResourceFacilities || []) if (!buildings[entry.building_id]) addIssue("ERROR", "sector_defs", `${id} initialResourceFacilities references ${entry.building_id}`);
  }
  for (const [id, ship] of Object.entries(ships)) {
    const modelId = ship.visual?.modelId;
    if (!modelId) addIssue("ERROR", "ship_defs", `${id} has no visual modelId`);
    const bindings = ship.visual?.effectBindings || [];
    if (!bindings.length) addIssue("WARNING", "ship_defs", `${id} has no GLB VFX bindings`);
    if (!bindings.some((component) => component.engineOutput === true)) addIssue("WARNING", "ship_defs", `${id} has no engine output binding`);
    for (const component of bindings) {
      if (!component.id) addIssue("ERROR", "ship_defs", `${id} has a VFX binding without id`);
      if (!vfxEffects[component.effectId]) addIssue("ERROR", "ship_defs", `${id}.${component.id} references missing VFX ${component.effectId}`);
      const objects = component.target?.objectMatches || [];
      const materials = component.target?.materialMatches || [];
      if (!objects.length && !materials.length) addIssue("WARNING", "ship_defs", `${id}.${component.id} has no GLB object/material target`);
    }
    const runtimeVfx = buildShipVfxFromComponents(ship.visual || {}, vfxEffects);
    const lightParts = runtimeVfx.lightParts || [];
    const engineLight = runtimeVfx.engineOutput?.controlledLightType;
    if (engineLight && !lightParts.some((part) => part.id === engineLight)) {
      addIssue("ERROR", "ship_defs", `${id} engineOutput references missing light part ${engineLight}`);
    }
  }
  const refs = collectAssetRefs();
  for (const id of refs.models) if (!capsule.assetRegistry.models?.[id]) addIssue("WARNING", "asset_registry", `Model ${id} has no path`);
  for (const id of refs.audio) if (!capsule.assetRegistry.audio?.[id]) addIssue("WARNING", "asset_registry", `Audio ${id} has no path`);
  for (const [kind, cfg] of Object.entries(entityConfig)) {
    for (const id of Object.keys(cfg.collection())) {
      for (const lang of ["ko", "en"]) {
        const content = capsule.i18n.content?.[lang]?.[cfg.singular]?.[id];
        if (!content?.name) addIssue("WARNING", "i18n", `${lang}.${cfg.singular}.${id}.name is empty`);
        if (cfg.singular !== "sector" && content && !("description" in content)) addIssue("WARNING", "i18n", `${lang}.${cfg.singular}.${id}.description is missing`);
      }
    }
  }
  updateHeader();
  countValues();
  return issues;
}

function addIssue(level, file, message) {
  issues.push({ level, file, message });
}

function renderIntegrity() {
  const root = $("#integrity-root");
  if (!issues.length) {
    root.innerHTML = `<div class="form-section"><div class="empty-state">No validation issues</div></div>`;
    return;
  }
  root.innerHTML = `<div class="form-section"><h3>Issues</h3><table class="issue-table"><thead><tr><th>Level</th><th>File</th><th>Message</th></tr></thead><tbody>
    ${issues.map((issue) => `<tr><td><span class="severity ${issue.level.toLowerCase()}">${issue.level}</span></td><td class="mono">${escapeHtml(issue.file)}</td><td>${escapeHtml(issue.message)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

$("#btn-run-validation").addEventListener("click", () => {

function resourceAllocated(id) {
  let total = 0;
  for (const ann of Object.values(capsule.chunkMap.chunks || {})) total += Number(ann.resourceAmounts?.[id] || 0);
  return total;
}

function mapAllocated() {
  let total = 0;
  for (const ann of Object.values(capsule.chunkMap.chunks || {})) for (const value of Object.values(ann.resourceAmounts || {})) total += Number(value || 0);
  return total;
}

function toFilePayload(slot) {
  syncGameDataBeforeOutput();
  if (slot === "assetRegistry") return buildAssetRegistryPayload();
  if (slot === "shipDefs") return buildShipDefsPayload();
  if (slot === "vfxDefs") return buildVfxDefsPayload();
  return clone(capsule[slot]);
}

function syncGameDataBeforeOutput() {
  capsule.chunkMap.sourceGmap = GAME_GMAP_FILE;
  syncClusterCatalog();
  syncVfxDefs();
  syncShipVisuals();
}

function buildAssetRegistryPayload() {
  const refs = collectAssetRefs();
  const source = capsule.assetRegistry || {};
  const models = {};
  const audio = {};

  for (const id of [...refs.models].sort()) {
    models[id] = source.models?.[id] || "";
  }
  for (const id of [...refs.audio].sort()) {
    audio[id] = source.audio?.[id] || "";
  }

  return {
    version: source.version || 1,
    models,
    audio
  };
}

function buildShipDefsPayload() {
  const payload = clone(capsule.shipDefs);
  for (const [id, ship] of Object.entries(payload.ships || {})) {
    const visual = ship.visual || {};
    const sourceVisual = capsule.shipDefs.ships?.[id]?.visual || {};
    ship.visual = {
      modelId: visual.modelId || id,
      reflectionIntensity: Number(visual.materials?.reflectionIntensity ?? visual.reflectionIntensity ?? 0.32),
      highlightColor: sourceVisual.highlightColor || visual.highlightColor || firstHighlightColor(sourceVisual) || firstHighlightColor(visual) || "#ffffff",
      emissiveSurface: {
        ...(visual.materials?.emissiveSurface || sourceVisual.materials?.emissiveSurface || { materialName: "EmissiveMTL_light", fallbackColor: "#ffffff" })
      },
      highlights: visual.materials?.highlights || sourceVisual.materials?.highlights || {},
      effectBindings: clone(sourceVisual.effectBindings || visual.effectBindings || [])
    };
    ship.visual.highlights.highlight_01 ??= {
      id: "highlight_01",
      label: "Highlight_01",
      materialName: "Highlight_01",
      defaultColor: ship.visual.highlightColor
    };
    ship.visual.highlights.highlight_01.defaultColor = ship.visual.highlightColor;
  }
  return payload;
}

function buildVfxDefsPayload() {
  syncVfxDefs();
  return clone(capsule.vfxDefs);
}

function downloadJson(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  downloadBlob(name, blob);
}

function downloadBinary(name, buffer) {
  downloadBlob(name, new Blob([buffer], { type: "application/octet-stream" }));
}

function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  let binary = "";
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function buildProjectPayload() {
  syncGameDataBeforeOutput();
  return {

}

function newProject() {

  capsule = makeEmptyCapsule();

  mapTool = "select";

async function openProjectFile(file) {
  const data = JSON.parse(await file.text());
  if (data.format !== PROJECT_FORMAT) {
    throw new Error("This is not a .ged editor save file.");
  }
  if (data.version !== PROJECT_VERSION) {
    throw new Error(`Unsupported .ged project version: ${data.version ?? "unknown"}.`);
  }
  if (!data.capsule) {
    throw new Error("Invalid .ged project: capsule payload is missing.");
  }
  const payload = data;
  capsule = normalizeCapsule(payload.capsule);
  selected = { ...makeEmptySelection(), ...(payload.editor?.selected || {}) };
  mapMode = payload.editor?.mapMode || "edit";
  mapTool = payload.editor?.mapTool || "select";
  mapViewScope = payload.editor?.mapViewScope || "cluster";
  showUnplacedChunks = payload.editor?.showUnplacedChunks !== false;
  activeCluster = Number(payload.editor?.activeCluster ?? 0);
  projectFileName = file.name || "";
  clearLoadedGmap();
  activeCluster = Number(payload.editor?.activeCluster ?? 0);
  mapViewScope = payload.editor?.mapViewScope || "cluster";
  showUnplacedChunks = payload.editor?.showUnplacedChunks !== false;
  if (payload.gmap?.base64) {
    const buffer = base64ToArrayBuffer(payload.gmap.base64);
    await applyGmapArrayBuffer(buffer, payload.gmap.fileName || GAME_GMAP_FILE, payload.gmap.byteLength || buffer.byteLength);
  }
  setMapMode(mapMode);
  setMapTool(mapTool);
  setShowUnplacedChunks(showUnplacedChunks);
  rerender();
  setActiveTab(payload.editor?.activeTab || "map");
  setDirty(false);
}

function exportAllFiles() {
  syncGameDataBeforeOutput();
  let delay = 0;
  for (const [slot, fileName] of Object.entries(FILES)) {
    setTimeout(() => downloadJson(fileName, toFilePayload(slot)), delay);
    delay += 120;
  }
  if (gmapBuffer) {
    setTimeout(() => downloadBinary(GAME_GMAP_FILE, gmapBuffer), delay);
  } else {
    alert(`${GAME_GMAP_FILE} is required but no .gmap file is loaded in this editor session.`);
  }
}

function normalizeCapsule(raw) {
  const base = makeEmptyCapsule();
  const next = { ...base };
  next.assetRegistry = raw.assetRegistry || base.assetRegistry;
  next.itemDefs = normalizeItems(raw.itemDefs || base.itemDefs);
  next.resourceDefs = normalizeResources(raw.resourceDefs || base.resourceDefs);
  next.buildingDefs = normalizeBuildings(raw.buildingDefs || base.buildingDefs);
  next.sectorDefs = normalizeSectors(raw.sectorDefs || base.sectorDefs);
  next.vfxDefs = normalizeVfxDefs(raw.vfxDefs || base.vfxDefs);
  next.shipDefs = normalizeShips(raw.shipDefs || base.shipDefs);
  next.i18n = normalizeI18n(raw.i18n || base.i18n);
  next.chunkMap = normalizeChunkMap(raw.chunkMap || base.chunkMap);
  const previousCapsule = capsule;
  capsule = next;
  syncVfxDefs();
  syncShipVisuals();
  const normalized = capsule;
  capsule = previousCapsule;
  return normalized;
}

function normalizeItems(raw) {
  const src = raw.items || {};
  const items = {};
  for (const [key, value] of Object.entries(src)) {
    if (key === "version") continue;
    const id = value.id || key;
    items[id] = { id, category: value.category || "resource", type: value.type || "mineral", mass: Number(value.mass ?? 1), tradable: value.tradable ?? true, stackable: value.stackable ?? true };
  }
  return { version: raw.version || 1, items };
}

function normalizeResources(raw) {
  const src = raw.resources || {};
  const resources = {};
  for (const [key, value] of Object.entries(src)) {
    if (key === "version") continue;
    const id = value.id || key;
    resources[id] = {
      id,
      producesItemId: value.producesItemId || "",
      nodeType: value.nodeType || "PERMANENT",
      totalCapacity: Number(value.totalCapacity ?? 0),
      spawnLimitPerCycle: Number(value.spawnLimitPerCycle ?? 0),
      nodeCapacityRange: value.nodeCapacityRange || [0, 0],
      sectorRatio: Number(value.sectorRatio ?? 0),
      baseYieldPerSec: Number(value.baseYieldPerSec ?? 0),
      visual: normalizeVisual(value.visual)
    };
    const lifetime = value.lifetimeRange;
    if (lifetime) resources[id].lifetimeRange = lifetime;
  }
  return { version: raw.version || 1, resources };
}

function normalizeBuildings(raw) {
  const src = raw.buildings || {};
  const buildings = {};
  for (const [key, value] of Object.entries(src)) {
    if (key === "version") continue;
    const id = value.id || key;
    const placement = value.placement || { type: "free_space" };

    buildings[id] = {

      adminCost: Number(value.adminCost ?? 0),

  return { version: raw.version || 1, buildings };
}

function normalizeSectors(raw) {
  const src = raw.sectors || {};

  for (const [key, value] of Object.entries(src)) {
    if (key === "version") continue;

      id,
      theme: value.theme || "Sector",
      themeMusicId: value.themeMusicId || "bgm_sector_01",
      color: value.color || SECTOR_COLORS[index % SECTOR_COLORS.length],
      betaVoidCount: Math.max(0, Math.round(Number(value.betaVoidCount ?? 1) || 0)),
      stats: value.stats || { base_gdp_coeff: 1, admin_capacity: 0, population_cap: 0, environmental_weight: { mining_efficiency: 1, agriculture_efficiency: 1 } },
      resourceWeights: value.resourceWeights || {},
      initialBuildings: value.initialBuildings || [],
      initialResourceFacilities: value.initialResourceFacilities || []
    };
    index++;
  }
  return { version: raw.version || 1, sectors };
}

function normalizeVfxDefs(raw = {}) {
  const effects = normalizeVfxEffects(raw.effects || {});
  return { version: raw.version || 1, effects };
}

function normalizeShips(raw) {
  const src = raw.ships || {};
  const ships = {};
  for (const [key, value] of Object.entries(src)) {
    if (key === "version") continue;

}

function normalizeVfxEffects(raw = {}) {
  const result = {};
  for (const [key, value] of Object.entries(raw)) {
    if (key === "version") continue;
    const id = value.id || key;
    result[id] = {
      id,
      kind: value.kind || "emissive_light",
      label: value.label || id,
      settings: {

}

function normalizeShipEffectBindings(bindings = []) {

}

function normalizeShipComponent(component = {}) {

    id: component.id || "component",

function normalizeShipBindingKind(kind) {

}

function normalizeI18n(raw) {

function normalizeChunkMap(raw) {

function normalizeVisual(visual = {}) {

function normalizeShipVisual(id, visual = {}) {

      },

        ? highlights
        : base.materials.highlights
    }
  };
}
