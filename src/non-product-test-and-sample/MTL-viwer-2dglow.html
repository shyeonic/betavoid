<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLB Ship Viewer - 2D Glow Test</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030811;
      color: #dce6f2;
      font-family: Arial, sans-serif;
    }

    #viewer {
      position: fixed;
      inset: 0;
    }

    #viewer canvas {
      display: block;
    }

    #screenGlowCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
    }

    .panel {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 2;
      width: min(420px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid rgba(160, 190, 220, 0.32);
      background: rgba(11, 15, 20, 0.82);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.45;
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status {
      margin-bottom: 10px;
      color: #9eb7ce;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin: 0 0 12px;
      padding: 10px;
      border: 1px solid rgba(160, 190, 220, 0.22);
      border-radius: 6px;
      background: rgba(5, 11, 18, 0.48);
    }

    .controls[hidden] {
      display: none;
    }

    .control-row {
      display: grid;
      gap: 5px;
    }

    .control-row label,
    .toggle-list span {
      color: #aebfd1;
      font-size: 11px;
    }

    .control-row select,
    .control-row input[type="color"],
    .param-list input {
      width: 100%;
      min-height: 30px;
      box-sizing: border-box;
      border: 1px solid rgba(160, 190, 220, 0.34);
      border-radius: 4px;
      background: #08111c;
      color: #dce6f2;
      font: inherit;
    }

    .control-row input[type="color"] {
      padding: 2px;
    }

    .toggle-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 10px;
    }

    .toggle-list label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: #dce6f2;
    }

    .toggle-list input {
      margin: 0;
      accent-color: #dce6f2;
    }

    .param-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
    }

    .param-list label {
      display: grid;
      gap: 4px;
      min-width: 0;
      color: #aebfd1;
      font-size: 11px;
    }

    .param-list input {
      color: #dce6f2;
    }

    .engine-output {
      display: grid;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(160, 190, 220, 0.18);
    }

    .engine-output[hidden] {
      display: none;
    }

    .star-bloom-controls {
      display: grid;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(160, 190, 220, 0.18);
    }

    .section-title {
      margin: 0;
      color: #dce6f2;
      font-size: 12px;
      font-weight: 700;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      color: #aebfd1;
      font-size: 11px;
    }

    .slider-row input {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: #dce6f2;
    }

    .range-grid {
      display: grid;
      grid-template-columns: 1fr repeat(2, minmax(70px, 0.7fr));
      gap: 6px;
      align-items: center;
      color: #aebfd1;
      font-size: 11px;
    }

    .range-grid input {
      min-width: 0;
      min-height: 28px;
      box-sizing: border-box;
      border: 1px solid rgba(160, 190, 220, 0.34);
      border-radius: 4px;
      background: #08111c;
      color: #dce6f2;
      font: inherit;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      color: #c8d8e8;
      font-family: Consolas, monospace;
      font-size: 11px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="viewer"></main>
  <canvas id="screenGlowCanvas" aria-hidden="true"></canvas>
  <section class="panel" aria-label="GLB loading status">
    <h1>GLB Ship Viewer - 2D Glow</h1>
    <div class="status" id="status">Loading embedded GLB materials...</div>
    <div class="controls" id="lightControls" hidden>
      <div class="control-row">
        <label for="lightTypeSelect">Light Type</label>
        <select id="lightTypeSelect">
          <option value="vfx_light_engine_001">vfx_light_engine_001</option>
          <option value="vfx_light_sub_001">vfx_light_sub_001</option>
          <option value="vfx_light_sub_002">vfx_light_sub_002</option>
        </select>
      </div>
      <div class="control-row">
        <label for="lightColorInput">Color</label>
        <input id="lightColorInput" type="color" value="#ffffff">
      </div>
      <div class="toggle-list">
        <label><input type="checkbox" data-light-control="emissiveBloom"> <span>Surface Bloom</span></label>
        <label><input type="checkbox" data-light-control="billboard"> <span>Billboard</span></label>
        <label><input type="checkbox" data-light-control="pointLight"> <span>PointLight</span></label>
        <label><input type="checkbox" data-light-control="screenGlow"> <span>2D Glow</span></label>
      </div>
      <div class="param-list">
        <label>Emissive <input type="number" data-light-param="emissiveIntensity" min="0" max="16" step="0.01"></label>
        <label>Range Scale <input type="number" data-light-param="lightRangeScale" min="0" max="12" step="0.01"></label>
        <label>Min Range <input type="number" data-light-param="minLightRange" min="0" max="8" step="0.01"></label>
        <label>Max Range <input type="number" data-light-param="maxLightRange" min="0" max="8" step="0.01"></label>
        <label>Billboard Size <input type="number" data-light-param="glowSpriteSpreadScale" min="0" max="8" step="0.01"></label>
        <label>Billboard Alpha <input type="number" data-light-param="glowSpriteOpacity" min="0" max="1" step="0.01"></label>
        <label>Point Power <input type="number" data-light-param="pointIntensity" min="0" max="8" step="0.01"></label>
        <label>Point Range <input type="number" data-light-param="pointRangeScale" min="0" max="8" step="0.01"></label>
      </div>
      <div class="engine-output" id="engineOutputControls" hidden>
        <label class="slider-row">
          <span>Engine Output</span>
          <output id="engineOutputValue">100%</output>
          <input id="engineOutputSlider" type="range" min="0" max="100" step="1" value="100">
        </label>
        <div class="range-grid">
          <span></span><span>Min</span><span>Max</span>
          <span>Emissive</span>
          <input type="number" data-engine-min="emissiveIntensity" min="0" max="16" step="0.01">
          <input type="number" data-engine-max="emissiveIntensity" min="0" max="16" step="0.01">
          <span>Billboard Alpha</span>
          <input type="number" data-engine-min="glowSpriteOpacity" min="0" max="1" step="0.01">
          <input type="number" data-engine-max="glowSpriteOpacity" min="0" max="1" step="0.01">
          <span>Point Power</span>
          <input type="number" data-engine-min="pointIntensity" min="0" max="8" step="0.01">
          <input type="number" data-engine-max="pointIntensity" min="0" max="8" step="0.01">
        </div>
      </div>
      <div class="star-bloom-controls" id="highlightControls">
        <p class="section-title">Highlight Material</p>
        <div class="control-row">
          <label for="highlightColorInput">Highlight_01</label>
          <input id="highlightColorInput" type="color" value="#ff97c2">
        </div>
      </div>
      <div class="star-bloom-controls" id="screenGlowControls">
        <p class="section-title">2D Screen Glow</p>
        <div class="toggle-list">
          <label><input id="screenGlowEnabledInput" type="checkbox" checked> <span>Enabled</span></label>
        </div>
        <div class="param-list">
          <label>Strength <input type="number" data-screen-glow-param="strength" min="0" max="4" step="0.01"></label>
          <label>Radius Scale <input type="number" data-screen-glow-param="radiusScale" min="0.1" max="6" step="0.01"></label>
          <label>Min Radius <input type="number" data-screen-glow-param="minRadius" min="0" max="80" step="1"></label>
          <label>Max Radius <input type="number" data-screen-glow-param="maxRadius" min="20" max="500" step="1"></label>
          <label>Core Ratio <input type="number" data-screen-glow-param="coreRatio" min="0" max="0.8" step="0.01"></label>
          <label>Facing Fade <input type="number" data-screen-glow-param="facingFade" min="0" max="1" step="0.01"></label>
        </div>
      </div>
      <div class="star-bloom-controls" id="starBloomControls">
        <p class="section-title">Star Bloom</p>
        <div class="toggle-list">
          <label><input id="starBloomEnabledInput" type="checkbox" checked> <span>Enabled</span></label>
        </div>
        <div class="param-list">
          <label>Strength <input type="number" data-star-bloom-param="strength" min="0" max="4" step="0.01"></label>
          <label>Radius <input type="number" data-star-bloom-param="radius" min="0" max="2" step="0.01"></label>
          <label>Threshold <input type="number" data-star-bloom-param="threshold" min="0" max="1" step="0.01"></label>
          <label>Size Scale <input type="number" data-star-bloom-param="sizeScale" min="0" max="8" step="0.01"></label>
          <label>Opacity Scale <input type="number" data-star-bloom-param="opacityScale" min="0" max="2" step="0.01"></label>
          <label>Color Power <input type="number" data-star-bloom-param="colorIntensity" min="0" max="8" step="0.01"></label>
          <label>Occlusion <input type="number" data-star-bloom-param="occlusionStrength" min="0" max="1" step="0.01"></label>
        </div>
      </div>
    </div>
    <pre id="summary">rss/ships/ship_01.glb</pre>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const VFX_LIGHT_ENGINE_ID = "vfx_light_engine_001";
    const VFX_LIGHT_SUB_HEAD_ID = "vfx_light_sub_001";
    const VFX_LIGHT_SUB_AUX_ID = "vfx_light_sub_002";
    const SCREEN_GLOW_EXPERIMENT_DEFAULTS = {
      emissiveBloom: false,
      billboard: false,
      pointLight: false,
      screenGlow: true
    };

    const SHIP_RENDER_DEFINITIONS = {
      ship_01: {
        id: "ship_01",
        label: "ship_01",
        asset: {
          type: "glb",
          url: "./rss/ships/ship_01.glb"
        },
        modelTransform: {
          normalizeLongestSide: 7,
          rotation: [0, Math.PI, 0]
        },
        materials: {
          reflectionIntensity: 0.32,
          emissiveSurface: {
            materialName: "EmissiveMTL_light",
            fallbackColor: 0xffffff
          },
          highlights: {
            highlight_01: {
              id: "highlight_01",
              label: "Highlight_01",
              materialName: "Highlight_01",
              defaultColor: "#ff97c2"
            }
          }
        },
        vfx: {
          defaultLightType: VFX_LIGHT_SUB_HEAD_ID,
          engineOutput: {
            controlledLightType: VFX_LIGHT_ENGINE_ID,
            value: 100,
            min: {
              emissiveIntensity: 0.2,
              glowSpriteOpacity: 0.04,
              pointIntensity: 0.05
            }
          },
          lightParts: [
            {
              id: VFX_LIGHT_ENGINE_ID,
              label: "vfx_light_engine_001",
              objectMatches: ["EmissivePlate_ship_01.001"],
              settings: {
                color: "#9b9bff",
                emissiveIntensity: 12,
                lightRangeScale: 2,
                minLightRange: 0.18,
                maxLightRange: 0.95,
                glowSpriteSpreadScale: 1.5,
                glowSpriteOpacity: 0.58,
                pointIntensity: 0.72,
                pointRangeScale: 0.86
              }
            },
            {
              id: VFX_LIGHT_SUB_HEAD_ID,
              label: "vfx_light_sub_001",
              objectMatches: ["EmissivePlate_ship_01.002"],
              settings: {
                color: "#ff0000",
                emissiveIntensity: 12,
                lightRangeScale: 2,
                minLightRange: 0.52,
                maxLightRange: 1.45,
                glowSpriteSpreadScale: 1.2,
                glowSpriteOpacity: 0.38,
                pointLightEnabled: false,
                pointIntensity: 0.52,
                pointRangeScale: 0.82
              }
            },
            {
              id: VFX_LIGHT_SUB_AUX_ID,
              label: "vfx_light_sub_002",
              objectMatches: [
                "EmissivePlate_ship_01.003",
                "EmissivePlate_ship_01.004",
                "EmissivePlate_ship_01.005",
                "EmissivePlate_ship_01.006"
              ],
              settings: {
                color: "#9b9bff",
                emissiveIntensity: 3,
                lightRangeScale: 2,
                minLightRange: 0.52,
                maxLightRange: 1.45,
                glowSpriteSpreadScale: 0.8,
                glowSpriteOpacity: 0.28,
                pointLightEnabled: false,
                pointIntensity: 0.2,
                pointRangeScale: 0.2
              }
            }
          ]
        }
      }
    };

    const SPACE_ENVIRONMENT_PRESETS = {
      deep_blue_void: {
        id: "deep_blue_void",
        scene: {
          background: 0x030811,
          fog: { type: "exp2", color: 0x05101b, density: 0.000004 },
          environment: { source: "room", blur: 0.04 }
        },
        renderer: {
          toneMappingExposure: 0.82
        },
        lights: [
          { type: "ambient", color: 0x9fb9d8, intensity: 0.28 },
          { type: "directional", color: 0xd9f1ff, intensity: 0.36, position: [7, 8, 6] },
          { type: "directional", color: 0x5cc8ff, intensity: 0.32, position: [-8, 4, -8] },
          { type: "hemisphere", skyColor: 0x93b6d5, groundColor: 0x08131c, intensity: 0.18 }
        ],
        objectBloom: {
          layer: 1,
          strength: 0.2,
          radius: 0.1,
          threshold: 0.14
        },
        starBloom: {
          layer: 2,
          enabled: true,
          strength: 1,
          radius: 2,
          threshold: 0.02,
          sizeScale: 1.2,
          opacityScale: 0.2,
          colorIntensity: 1,
          occlusionStrength: 1,
          radiusSizeScale: 2
        },
        starField: {
          layers: [
            { count: 1800, radius: 8500, size: 32.8, opacity: 0.98 },
            { count: 900, radius: 24000, size: 51.2, opacity: 0.74 },
            { count: 420, radius: 52000, size: 73.6, opacity: 0.5 }
          ]
        }
      }
    };

    const VIEWER_SCENARIO = {
      shipId: "ship_01",
      environmentId: "deep_blue_void"
    };
    const ACTIVE_SHIP_DEFINITION = SHIP_RENDER_DEFINITIONS[VIEWER_SCENARIO.shipId];
    const ACTIVE_SPACE_ENVIRONMENT = SPACE_ENVIRONMENT_PRESETS[VIEWER_SCENARIO.environmentId];
    const BLOOM_LAYER = ACTIVE_SPACE_ENVIRONMENT.objectBloom.layer;
    const BLOOM_STRENGTH = ACTIVE_SPACE_ENVIRONMENT.objectBloom.strength;
    const BLOOM_RADIUS = ACTIVE_SPACE_ENVIRONMENT.objectBloom.radius;
    const BLOOM_THRESHOLD = ACTIVE_SPACE_ENVIRONMENT.objectBloom.threshold;
    const STAR_BLOOM_LAYER = ACTIVE_SPACE_ENVIRONMENT.starBloom.layer;
    const STAR_BLOOM_RADIUS_SIZE_SCALE = ACTIVE_SPACE_ENVIRONMENT.starBloom.radiusSizeScale;
    const STAR_FIELD_LAYERS = ACTIVE_SPACE_ENVIRONMENT.starField.layers;
    function createLightProfileMatches(shipDefinition) {
      return shipDefinition.vfx.lightParts.map((definition) => ({
        id: definition.id,
        normalizedNames: definition.objectMatches.map((name) => normalizeSceneName(name))
      }));
    }

    function createBaseLightProfiles(shipDefinition) {
      return Object.fromEntries(shipDefinition.vfx.lightParts.map((definition) => [
        definition.id,
        {
          id: definition.id,
          type: definition.id,
          label: definition.label,
          objectMatches: definition.objectMatches,
          fallbackColor: shipDefinition.materials.emissiveSurface.fallbackColor,
          ...definition.settings
        }
      ]));
    }

    function cloneLightProfiles(shipDefinition) {
      return Object.fromEntries(
        Object.entries(createBaseLightProfiles(shipDefinition)).map(([type, profile]) => [
          type,
          {
            ...profile,
            objectMatches: [...profile.objectMatches]
          }
        ])
      );
    }

    function createLightControlState(lightProfiles) {
      return Object.fromEntries(
        Object.entries(lightProfiles).map(([type, profile]) => [
          type,
          {
            emissiveBloom: SCREEN_GLOW_EXPERIMENT_DEFAULTS.emissiveBloom && profile.emissiveBloomEnabled !== false,
            billboard: SCREEN_GLOW_EXPERIMENT_DEFAULTS.billboard && profile.glowSpriteEnabled !== false,
            pointLight: SCREEN_GLOW_EXPERIMENT_DEFAULTS.pointLight && profile.pointLightEnabled !== false,
            screenGlow: SCREEN_GLOW_EXPERIMENT_DEFAULTS.screenGlow && profile.screenGlowEnabled !== false
          }
        ])
      );
    }

    function createEngineOutputSettings(shipDefinition, lightProfiles) {
      const outputDefinition = shipDefinition.vfx.engineOutput;
      const controlledLightType = outputDefinition.controlledLightType;
      const engineProfile = lightProfiles[controlledLightType];
      return {
        controlledLightType,
        value: outputDefinition.value,
        min: { ...outputDefinition.min },
        max: {
          emissiveIntensity: engineProfile.emissiveIntensity,
          glowSpriteOpacity: engineProfile.glowSpriteOpacity,
          pointIntensity: engineProfile.pointIntensity
        }
      };
    }

    function createHighlightPartStates(shipDefinition) {
      return Object.fromEntries(
        Object.entries(shipDefinition.materials.highlights).map(([partId, part]) => [
          partId,
          {
            id: part.id,
            label: part.label,
            materialName: part.materialName,
            settings: {
              color: part.defaultColor
            },
            materials: []
          }
        ])
      );
    }

    function createShipVfxState(shipDefinition = ACTIVE_SHIP_DEFINITION, object = null) {
      const lightProfiles = cloneLightProfiles(shipDefinition);
      const highlightParts = createHighlightPartStates(shipDefinition);
      return {
        definition: shipDefinition,
        object,
        lightProfiles,
        lightProfileMatches: createLightProfileMatches(shipDefinition),
        lightControlState: createLightControlState(lightProfiles),
        engineOutputSettings: createEngineOutputSettings(shipDefinition, lightProfiles),
        highlight: {
          activePartId: Object.keys(highlightParts)[0],
          parts: highlightParts
        },
        blueLightRuntimeAnchors: [],
        blueLightRuntimeAnchorsDirty: true,
        screenGlowOcclusionTargets: [],
        blueEmissionTargets: []
      };
    }

    let activeShipVfxState = createShipVfxState(ACTIVE_SHIP_DEFINITION);

    const status = document.querySelector("#status");
    const summary = document.querySelector("#summary");
    const container = document.querySelector("#viewer");
    const screenGlowCanvas = document.querySelector("#screenGlowCanvas");
    const screenGlowContext = screenGlowCanvas.getContext("2d");
    const lightControls = document.querySelector("#lightControls");
    const lightTypeSelect = document.querySelector("#lightTypeSelect");
    const lightColorInput = document.querySelector("#lightColorInput");
    const lightControlInputs = Array.from(lightControls.querySelectorAll("[data-light-control]"));
    const lightParamInputs = Array.from(lightControls.querySelectorAll("[data-light-param]"));
    const engineOutputControls = document.querySelector("#engineOutputControls");
    const engineOutputSlider = document.querySelector("#engineOutputSlider");
    const engineOutputValue = document.querySelector("#engineOutputValue");
    const engineMinInputs = Array.from(engineOutputControls.querySelectorAll("[data-engine-min]"));
    const engineMaxInputs = Array.from(engineOutputControls.querySelectorAll("[data-engine-max]"));
    const highlightColorInput = document.querySelector("#highlightColorInput");
    const highlightColorLabel = document.querySelector("label[for='highlightColorInput']");
    const screenGlowEnabledInput = document.querySelector("#screenGlowEnabledInput");
    const screenGlowParamInputs = Array.from(document.querySelectorAll("[data-screen-glow-param]"));
    const starBloomEnabledInput = document.querySelector("#starBloomEnabledInput");
    const starBloomParamInputs = Array.from(document.querySelectorAll("[data-star-bloom-param]"));

    function populateLightTypeSelect(shipDefinition) {
      lightTypeSelect.replaceChildren(
        ...shipDefinition.vfx.lightParts.map((lightPart) => {
          const option = document.createElement("option");
          option.value = lightPart.id;
          option.textContent = lightPart.label;
          return option;
        })
      );
    }

    populateLightTypeSelect(ACTIVE_SHIP_DEFINITION);

    function createEnvironmentVfxState(environmentPreset) {
      return {
        preset: environmentPreset,
        starBloom: {
          enabled: false,
          strength: environmentPreset.starBloom.strength,
          radius: environmentPreset.starBloom.radius,
          threshold: environmentPreset.starBloom.threshold,
          sizeScale: environmentPreset.starBloom.sizeScale,
          opacityScale: environmentPreset.starBloom.opacityScale,
          colorIntensity: environmentPreset.starBloom.colorIntensity,
          occlusionStrength: environmentPreset.starBloom.occlusionStrength
        }
      };
    }

    const activeEnvironmentVfxState = createEnvironmentVfxState(ACTIVE_SPACE_ENVIRONMENT);
    const starBloomSettings = activeEnvironmentVfxState.starBloom;
    const screenGlowSettings = {
      enabled: true,
      strength: 1.15,
      radiusScale: 1.85,
      minRadius: 12,
      maxRadius: 220,
      coreRatio: 0.14,
      facingFade: 0.55,
      occlusionEnabled: true,
      occlusionBias: 0.06
    };
    const screenGlowSize = { width: 0, height: 0, dpr: 1 };
    const screenGlowRaycaster = new THREE.Raycaster();
    const screenGlowOcclusionHits = [];
    const screenGlowScratch = {
      projected: new THREE.Vector3(),
      cameraDirection: new THREE.Vector3(),
      toCamera: new THREE.Vector3(),
      depthVector: new THREE.Vector3(),
      rayDirection: new THREE.Vector3(),
      glowOrigin: new THREE.Vector3()
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(ACTIVE_SPACE_ENVIRONMENT.scene.background);
    scene.fog = new THREE.FogExp2(
      ACTIVE_SPACE_ENVIRONMENT.scene.fog.color,
      ACTIVE_SPACE_ENVIRONMENT.scene.fog.density
    );

    const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 80000);
    camera.position.set(0, 4, 12);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = ACTIVE_SPACE_ENVIRONMENT.renderer.toneMappingExposure;
    renderer.shadowMap.enabled = false;
    container.append(renderer.domElement);

    function resizeScreenGlowCanvas() {
      screenGlowSize.dpr = Math.min(window.devicePixelRatio || 1, 2);
      screenGlowSize.width = Math.floor(window.innerWidth);
      screenGlowSize.height = Math.floor(window.innerHeight);
      screenGlowCanvas.width = Math.floor(screenGlowSize.width * screenGlowSize.dpr);
      screenGlowCanvas.height = Math.floor(screenGlowSize.height * screenGlowSize.dpr);
      screenGlowCanvas.style.width = `${screenGlowSize.width}px`;
      screenGlowCanvas.style.height = `${screenGlowSize.height}px`;
      screenGlowContext.setTransform(screenGlowSize.dpr, 0, 0, screenGlowSize.dpr, 0, 0);
    }

    resizeScreenGlowCanvas();

    const bloomLayer = new THREE.Layers();
    bloomLayer.set(BLOOM_LAYER);
    const starBloomLayer = new THREE.Layers();
    starBloomLayer.set(STAR_BLOOM_LAYER);

    const bloomComposer = new EffectComposer(renderer);
    bloomComposer.renderToScreen = false;
    bloomComposer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    bloomComposer.setSize(window.innerWidth, window.innerHeight);
    const bloomRenderPass = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      BLOOM_STRENGTH,
      BLOOM_RADIUS,
      BLOOM_THRESHOLD
    );
    bloomComposer.addPass(bloomRenderPass);
    bloomComposer.addPass(bloomPass);

    const starBloomRenderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
      depthBuffer: true,
      stencilBuffer: false
    });
    const starBloomPass = {
      strength: starBloomSettings.strength,
      radius: starBloomSettings.radius,
      threshold: starBloomSettings.threshold
    };

    const starOcclusionRenderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
      depthBuffer: true,
      stencilBuffer: false
    });

    const finalComposer = new EffectComposer(renderer);
    finalComposer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    finalComposer.setSize(window.innerWidth, window.innerHeight);
    const finalRenderPass = new RenderPass(scene, camera);
    const bloomCompositePass = new ShaderPass(
      new THREE.ShaderMaterial({
        uniforms: {
          baseTexture: { value: null },
          bloomTexture: { value: bloomComposer.renderTarget2.texture },
          starBloomTexture: { value: starBloomRenderTarget.texture },
          starOcclusionTexture: { value: starOcclusionRenderTarget.texture },
          starBloomCompositeStrength: { value: 1 },
          starBloomOcclusionStrength: { value: starBloomSettings.occlusionStrength }
        },
        vertexShader: `
          varying vec2 vUv;

          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D baseTexture;
          uniform sampler2D bloomTexture;
          uniform sampler2D starBloomTexture;
          uniform sampler2D starOcclusionTexture;
          uniform float starBloomCompositeStrength;
          uniform float starBloomOcclusionStrength;
          varying vec2 vUv;

          void main() {
            vec4 baseColor = texture2D(baseTexture, vUv);
            vec4 objectBloom = texture2D(bloomTexture, vUv);
            vec4 starBloom = texture2D(starBloomTexture, vUv);
            float starOcclusion = texture2D(starOcclusionTexture, vUv).r * starBloomOcclusionStrength;
            gl_FragColor = baseColor + objectBloom + starBloom * starBloomCompositeStrength * (1.0 - clamp(starOcclusion, 0.0, 1.0));
          }
        `
      }),
      "baseTexture"
    );
    const outputPass = new OutputPass();
    finalComposer.addPass(finalRenderPass);
    finalComposer.addPass(bloomCompositePass);
    finalComposer.addPass(outputPass);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    window.__glbViewerScene = scene;
    window.__glbViewerCamera = camera;
    window.__glbViewerRenderer = renderer;
    window.__glbViewerComposer = finalComposer;
    window.__glbViewerBloomComposer = bloomComposer;
    window.__glbViewerBloomPass = bloomPass;
    window.__glbViewerBloomLayer = bloomLayer;
    window.__glbViewerStarBloomRenderTarget = starBloomRenderTarget;
    window.__glbViewerStarBloomPass = starBloomPass;
    window.__glbViewerStarBloomLayer = starBloomLayer;
    window.__glbViewerShipDefinitions = SHIP_RENDER_DEFINITIONS;
    window.__glbViewerEnvironmentPresets = SPACE_ENVIRONMENT_PRESETS;
    window.__glbViewerScenario = VIEWER_SCENARIO;
    window.__glbViewerEnvironmentVfxState = activeEnvironmentVfxState;
    window.__glbViewerScreenGlowCanvas = screenGlowCanvas;
    window.__glbViewerScreenGlowSettings = screenGlowSettings;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 3;
    controls.maxDistance = 80;

    const environmentLights = ACTIVE_SPACE_ENVIRONMENT.lights.map((lightDefinition) => {
      let light;
      if (lightDefinition.type === "ambient") {
        light = new THREE.AmbientLight(lightDefinition.color, lightDefinition.intensity);
      } else if (lightDefinition.type === "directional") {
        light = new THREE.DirectionalLight(lightDefinition.color, lightDefinition.intensity);
        light.position.set(...lightDefinition.position);
      } else if (lightDefinition.type === "hemisphere") {
        light = new THREE.HemisphereLight(
          lightDefinition.skyColor,
          lightDefinition.groundColor,
          lightDefinition.intensity
        );
      }
      if (light) scene.add(light);
      return light;
    }).filter(Boolean);

    const starBloomObjects = [];
    const starPointMaterials = [];
    const starPointScaleSize = new THREE.Vector2();
    const lastStarCameraPosition = new THREE.Vector3();
    const lastStarCameraQuaternion = new THREE.Quaternion();
    const lastStarCameraProjectionMatrix = new THREE.Matrix4();
    const starRenderPreviousClearColor = new THREE.Color();
    const starOcclusionBackgroundColor = new THREE.Color(0x000000);
    let starBloomRenderDirty = true;
    let starOcclusionRenderDirty = true;
    let hasStarCameraSnapshot = false;

    STAR_FIELD_LAYERS
      .map((starLayer) => createStars(starLayer))
      .forEach((stars) => scene.add(stars));

    function createRoundStarMaterial(options) {
      const colorMultiplier = options.color || new THREE.Color(1, 1, 1);
      const material = new THREE.ShaderMaterial({
        uniforms: {
          pointSize: { value: options.size },
          pointScale: { value: getStarPointScale() },
          opacity: { value: options.opacity },
          colorMultiplier: { value: colorMultiplier.clone() },
          softness: { value: options.softness ?? 0.42 },
          falloffPower: { value: options.falloffPower ?? 0.85 },
          alphaCutoff: { value: options.alphaCutoff ?? 0.001 }
        },
        vertexShader: `
          uniform float pointSize;
          uniform float pointScale;
          varying vec3 vColor;

          void main() {
            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = pointSize * (pointScale / max(0.0001, -mvPosition.z));
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform float opacity;
          uniform vec3 colorMultiplier;
          uniform float softness;
          uniform float falloffPower;
          uniform float alphaCutoff;
          varying vec3 vColor;

          void main() {
            vec2 pointUv = gl_PointCoord.xy - vec2(0.5);
            float pointDistance = length(pointUv) * 2.0;
            if (pointDistance > 1.0) discard;

            float edgeStart = clamp(1.0 - softness, 0.02, 0.98);
            float pointAlpha = pow(1.0 - smoothstep(edgeStart, 1.0, pointDistance), falloffPower);
            if (pointAlpha <= alphaCutoff) discard;
            gl_FragColor = vec4(vColor * colorMultiplier, opacity * pointAlpha);
          }
        `,
        transparent: options.transparent,
        blending: options.blending || THREE.NormalBlending,
        depthTest: options.depthTest !== false,
        depthWrite: options.depthWrite === true,
        fog: options.fog === true,
        toneMapped: options.toneMapped !== false,
        vertexColors: true
      });
      starPointMaterials.push(material);
      return material;
    }

    function getStarBloomSoftness() {
      return THREE.MathUtils.clamp(0.58 + starBloomSettings.radius * 0.28, 0.2, 0.96);
    }

    function getStarBloomFalloffPower() {
      return THREE.MathUtils.clamp(2.1 - starBloomSettings.radius * 0.45, 0.75, 2.4);
    }

    function getStarBloomPointSize(baseSize) {
      const radiusScale = 1 + starBloomSettings.radius * STAR_BLOOM_RADIUS_SIZE_SCALE;
      return baseSize * starBloomSettings.sizeScale * radiusScale;
    }

    function getStarBloomAlphaCutoff() {
      return THREE.MathUtils.clamp(starBloomSettings.threshold * 0.12, 0.001, 0.18);
    }

    function getStarPointScale() {
      renderer.getDrawingBufferSize(starPointScaleSize);
      return starPointScaleSize.y * 0.5;
    }

    function updateStarPointScales() {
      const pointScale = getStarPointScale();
      starPointMaterials.forEach((material) => {
        material.uniforms.pointScale.value = pointScale;
      });
    }

    function isStarBloomActive() {
      return starBloomSettings.enabled
        && starBloomSettings.strength > 0
        && starBloomSettings.sizeScale > 0
        && starBloomSettings.opacityScale > 0
        && starBloomSettings.colorIntensity > 0;
    }

    function isStarOcclusionActive() {
      return isStarBloomActive() && starBloomSettings.occlusionStrength > 0;
    }

    function markStarRenderDirty() {
      starBloomRenderDirty = true;
      starOcclusionRenderDirty = true;
    }

    function updateStarRenderDirtyForCamera() {
      const cameraChanged = !hasStarCameraSnapshot
        || !lastStarCameraPosition.equals(camera.position)
        || !lastStarCameraQuaternion.equals(camera.quaternion)
        || !lastStarCameraProjectionMatrix.equals(camera.projectionMatrix);

      if (!cameraChanged) return;

      lastStarCameraPosition.copy(camera.position);
      lastStarCameraQuaternion.copy(camera.quaternion);
      lastStarCameraProjectionMatrix.copy(camera.projectionMatrix);
      hasStarCameraSnapshot = true;
      markStarRenderDirty();
    }

    function createStars({ count, radius, size, opacity }) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color = new THREE.Color();

      for (let i = 0; i < count; i += 1) {
        const index = i * 3;
        positions[index] = (Math.random() * 2 - 1) * radius;
        positions[index + 1] = (Math.random() * 2 - 1) * radius;
        positions[index + 2] = (Math.random() * 2 - 1) * radius;

        const hue = 0.58 + Math.random() * 0.08;
        const saturation = 0.78 + Math.random() * 0.2;
        const lightness = 0.08 + Math.random() * 0.58;
        color.setHSL(hue, saturation, lightness);
        colors[index] = color.r;
        colors[index + 1] = color.g;
        colors[index + 2] = color.b;
      }

      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = createRoundStarMaterial({
        size,
        transparent: true,
        opacity,
        softness: 0.34,
        alphaCutoff: 0.001,
        depthWrite: false,
        fog: false
      });

      const stars = new THREE.Points(geometry, material);
      stars.name = "StarField";
      stars.userData.skipStarOcclusionMask = true;
      stars.userData.skipObjectBloomPass = true;

      const bloomMaterial = createRoundStarMaterial({
        size: getStarBloomPointSize(size),
        color: new THREE.Color(
          starBloomSettings.colorIntensity,
          starBloomSettings.colorIntensity,
          starBloomSettings.colorIntensity
        ),
        transparent: true,
        opacity: opacity * starBloomSettings.opacityScale,
        softness: getStarBloomSoftness(),
        falloffPower: getStarBloomFalloffPower(),
        alphaCutoff: getStarBloomAlphaCutoff(),
        blending: THREE.AdditiveBlending,
        depthTest: true,
        depthWrite: false,
        fog: false,
        toneMapped: false
      });
      const bloomStars = new THREE.Points(geometry, bloomMaterial);
      bloomStars.name = "StarFieldBloom";
      bloomStars.layers.set(STAR_BLOOM_LAYER);
      bloomStars.userData.skipStarOcclusionMask = true;
      bloomStars.userData.skipObjectBloomPass = true;
      bloomStars.userData.baseSize = size;
      bloomStars.userData.baseOpacity = opacity;
      starBloomObjects.push(bloomStars);

      const starGroup = new THREE.Group();
      starGroup.name = "StarFieldLayer";
      starGroup.userData.skipStarOcclusionMask = true;
      starGroup.add(stars, bloomStars);
      return starGroup;
    }

    function normalizeObject(object, shipDefinition = ACTIVE_SHIP_DEFINITION) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const longest = Math.max(size.x, size.y, size.z) || 1;
      const scale = shipDefinition.modelTransform.normalizeLongestSide / longest;
      object.scale.setScalar(scale);
      object.position.copy(center).multiplyScalar(-scale);
      object.rotation.set(...shipDefinition.modelTransform.rotation);
      return object;
    }

    function isBlueEmissiveMaterial(material, shipDefinition = ACTIVE_SHIP_DEFINITION) {
      return normalizeSceneName(material?.name || "")
        .includes(normalizeSceneName(shipDefinition.materials.emissiveSurface.materialName));
    }

    function getActiveHighlightPart(shipState = activeShipVfxState) {
      return shipState.highlight.parts[shipState.highlight.activePartId];
    }

    function findHighlightPartForMaterial(material, shipState = activeShipVfxState) {
      const materialName = normalizeSceneName(material?.name || "");
      return Object.values(shipState.highlight.parts).find((part) => {
        return materialName === normalizeSceneName(part.materialName);
      });
    }

    function getBlueLightProfile(mesh, materials, shipState = activeShipVfxState) {
      const names = [
        mesh.name,
        mesh.parent?.name,
        ...materials.map((material) => material?.name)
      ].filter(Boolean);
      const normalizedNames = names.map((name) => normalizeSceneName(name));

      const match = shipState.lightProfileMatches.find((profileMatch) => {
        return profileMatch.normalizedNames.some((target) => {
          return normalizedNames.some((name) => name.includes(target) || target.includes(name));
        });
      });

      return match
        ? shipState.lightProfiles[match.id]
        : shipState.lightProfiles[shipState.definition.vfx.defaultLightType];
    }

    function normalizeSceneName(name) {
      return name.toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getProfileColor(profile) {
      return new THREE.Color(profile.color || profile.fallbackColor);
    }

    function addBlueSurfacePointLight(origin, distance, profile, surfaceSize) {
      const sizeFactor = THREE.MathUtils.clamp(surfaceSize / 0.24, 0.55, 1.45);
      const light = new THREE.PointLight(
        getProfileColor(profile),
        profile.pointIntensity * sizeFactor,
        distance * profile.pointRangeScale,
        2
      );
      light.name = `PhysicalPointLight_${profile.type}`;
      light.position.copy(origin);
      light.visible = profile.pointLightEnabled !== false;
      scene.add(light);
      return light;
    }

    const darkMaterial = new THREE.MeshBasicMaterial({ color: "black" });
    const darkPointsMaterial = new THREE.PointsMaterial({ color: "black", size: 1, sizeAttenuation: true });
    const darkLineMaterial = new THREE.LineBasicMaterial({ color: "black" });
    const darkSpriteMaterial = new THREE.SpriteMaterial({ color: "black" });
    const starOcclusionMaskMaterial = new THREE.MeshBasicMaterial({ color: "white", side: THREE.DoubleSide });
    const starOcclusionLineMaskMaterial = new THREE.LineBasicMaterial({ color: "white" });
    const darkenedDuringBloom = [];
    const objectBloomDarkenTargets = [];
    const objectBloomHiddenTargets = [];
    const maskedDuringStarOcclusion = [];
    let activeBloomLayer = bloomLayer;
    let objectBloomTargetsDirty = true;

    function isRenderableObject(object) {
      return object.isMesh || object.isPoints || object.isLine || object.isSprite;
    }

    function markObjectBloomTargetsDirty() {
      objectBloomTargetsDirty = true;
    }

    function collectObjectBloomTargets() {
      objectBloomDarkenTargets.length = 0;
      objectBloomHiddenTargets.length = 0;

      scene.traverse((object) => {
        if (!isRenderableObject(object) || bloomLayer.test(object.layers)) return;

        if (object.userData.skipObjectBloomPass) {
          objectBloomHiddenTargets.push(object);
        } else {
          objectBloomDarkenTargets.push(object);
        }
      });

      objectBloomTargetsDirty = false;
    }

    function getObjectBloomDarkMaterial(object) {
      return object.isPoints
        ? darkPointsMaterial
        : object.isLine
          ? darkLineMaterial
          : object.isSprite
            ? darkSpriteMaterial
            : darkMaterial;
    }

    function prepareObjectBloomTargets() {
      if (objectBloomTargetsDirty) collectObjectBloomTargets();

      objectBloomHiddenTargets.forEach((object) => {
        if (!object.visible) return;
        darkenedDuringBloom.push({
          object,
          material: object.material,
          visible: object.visible
        });
        object.visible = false;
      });

      objectBloomDarkenTargets.forEach((object) => {
        if (!object.visible) return;
        darkenedDuringBloom.push({
          object,
          material: object.material,
          visible: object.visible
        });
        object.material = getObjectBloomDarkMaterial(object);
      });
    }

    function darkenNonBloomed(object) {
      if (!isRenderableObject(object) || activeBloomLayer.test(object.layers)) return;
      darkenedDuringBloom.push({
        object,
        material: object.material,
        visible: object.visible
      });
      if (object.userData.skipObjectBloomPass) {
        object.visible = false;
        return;
      }
      object.material = getObjectBloomDarkMaterial(object);
    }

    function restoreBloomMaterials() {
      darkenedDuringBloom.forEach(({ object, material, visible }) => {
        object.material = material;
        object.visible = visible;
      });
      darkenedDuringBloom.length = 0;
    }

    function prepareStarOcclusionMask(object) {
      if (!isRenderableObject(object) || !object.visible) return;

      maskedDuringStarOcclusion.push({
        object,
        material: object.material,
        visible: object.visible
      });

      if (object.userData.skipStarOcclusionMask || object.isPoints || object.isSprite) {
        object.visible = false;
        return;
      }

      object.material = object.isLine
        ? starOcclusionLineMaskMaterial
        : starOcclusionMaskMaterial;
    }

    function restoreStarOcclusionMask() {
      maskedDuringStarOcclusion.forEach(({ object, material, visible }) => {
        object.material = material;
        object.visible = visible;
      });
      maskedDuringStarOcclusion.length = 0;
    }

    function renderStarOcclusionMask() {
      const originalBackground = scene.background;
      const originalFog = scene.fog;
      const originalRenderTarget = renderer.getRenderTarget();

      scene.traverse(prepareStarOcclusionMask);
      scene.background = starOcclusionBackgroundColor;
      scene.fog = null;
      renderer.setRenderTarget(starOcclusionRenderTarget);
      renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(originalRenderTarget);
      scene.background = originalBackground;
      scene.fog = originalFog;
      restoreStarOcclusionMask();
      starOcclusionRenderDirty = false;
    }

    function renderBloom(composer, layer, cameraLayerId = null) {
      const originalCameraLayerMask = camera.layers.mask;

      activeBloomLayer = layer;
      if (cameraLayerId !== null) camera.layers.set(cameraLayerId);
      if (layer === bloomLayer) {
        prepareObjectBloomTargets();
      } else {
        scene.traverse(darkenNonBloomed);
      }
      composer.render();
      restoreBloomMaterials();
      camera.layers.mask = originalCameraLayerMask;
    }

    function renderStarBloom() {
      const originalCameraLayerMask = camera.layers.mask;
      const originalRenderTarget = renderer.getRenderTarget();
      const originalBackground = scene.background;
      const originalFog = scene.fog;
      const originalClearColor = renderer.getClearColor(starRenderPreviousClearColor);
      const originalClearAlpha = renderer.getClearAlpha();

      camera.layers.set(STAR_BLOOM_LAYER);
      scene.background = null;
      scene.fog = null;
      renderer.setClearColor(0x000000, 0);
      renderer.setRenderTarget(starBloomRenderTarget);
      renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(originalRenderTarget);
      renderer.setClearColor(originalClearColor, originalClearAlpha);
      scene.background = originalBackground;
      scene.fog = originalFog;
      camera.layers.mask = originalCameraLayerMask;
      starBloomRenderDirty = false;
    }

    function getSelectedMaterialIndices(materials, shipDefinition = ACTIVE_SHIP_DEFINITION) {
      return materials
        .map((material, index) => (isBlueEmissiveMaterial(material, shipDefinition) ? index : -1))
        .filter((index) => index >= 0);
    }

    function getGeometryRanges(geometry, materialIndices, materialCount) {
      const vertexCount = geometry.index ? geometry.index.count : geometry.attributes.position.count;
      if (geometry.groups.length > 0) {
        return geometry.groups
          .filter((group) => materialIndices.includes(group.materialIndex))
          .map((group) => ({ start: group.start, count: group.count }));
      }

      if (materialCount <= 1 || materialIndices.includes(0)) {
        return [{ start: 0, count: vertexCount }];
      }

      return [];
    }

    function getTriangleVertexIndex(geometry, drawIndex) {
      return geometry.index ? geometry.index.getX(drawIndex) : drawIndex;
    }

    function getBlueLightSurface(mesh, materialIndices, modelCenter) {
      const geometry = mesh.geometry;
      const position = geometry.attributes.position;
      if (!position) return null;

      const ranges = getGeometryRanges(
        geometry,
        materialIndices,
        Array.isArray(mesh.material) ? mesh.material.length : 1
      );
      if (ranges.length === 0) return null;

      const normalMatrix = new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld);
      const center = new THREE.Vector3();
      const direction = new THREE.Vector3();
      const a = new THREE.Vector3();
      const b = new THREE.Vector3();
      const c = new THREE.Vector3();
      const ab = new THREE.Vector3();
      const ac = new THREE.Vector3();
      const bc = new THREE.Vector3();
      const triangleCenter = new THREE.Vector3();
      const triangleNormal = new THREE.Vector3();
      const longestEdge = new THREE.Vector3(1, 0, 0);
      const surfacePoints = [];
      let totalArea = 0;
      let longestEdgeLengthSq = 0;

      ranges.forEach((range) => {
        const triangleEnd = range.start + range.count - ((range.start + range.count) % 3);
        for (let i = range.start; i < triangleEnd; i += 3) {
          a.fromBufferAttribute(position, getTriangleVertexIndex(geometry, i)).applyMatrix4(mesh.matrixWorld);
          b.fromBufferAttribute(position, getTriangleVertexIndex(geometry, i + 1)).applyMatrix4(mesh.matrixWorld);
          c.fromBufferAttribute(position, getTriangleVertexIndex(geometry, i + 2)).applyMatrix4(mesh.matrixWorld);

          ab.subVectors(b, a);
          ac.subVectors(c, a);
          bc.subVectors(c, b);
          [
            { edge: ab, lengthSq: ab.lengthSq() },
            { edge: ac, lengthSq: ac.lengthSq() },
            { edge: bc, lengthSq: bc.lengthSq() }
          ].forEach(({ edge, lengthSq }) => {
            if (lengthSq <= longestEdgeLengthSq) return;
            longestEdge.copy(edge);
            longestEdgeLengthSq = lengthSq;
          });

          triangleNormal.crossVectors(ab, ac);
          const areaWeight = triangleNormal.length() * 0.5;
          if (areaWeight <= 0) continue;

          surfacePoints.push(a.clone(), b.clone(), c.clone());
          triangleNormal.normalize().applyMatrix3(normalMatrix).normalize();
          triangleCenter.copy(a).add(b).add(c).multiplyScalar(1 / 3);
          center.addScaledVector(triangleCenter, areaWeight);
          direction.addScaledVector(triangleNormal, areaWeight);
          totalArea += areaWeight;
        }
      });

      if (totalArea <= 0) return null;

      center.multiplyScalar(1 / totalArea);
      if (direction.lengthSq() < 0.000001) {
        direction.subVectors(center, modelCenter);
      }
      direction.normalize();

      const outward = center.clone().sub(modelCenter);
      if (outward.lengthSq() > 0.000001 && direction.dot(outward) < 0) {
        direction.multiplyScalar(-1);
      }

      const tangent = longestEdge.clone().addScaledVector(direction, -longestEdge.dot(direction));
      if (tangent.lengthSq() < 0.000001) {
        const tangentReference = Math.abs(direction.dot(new THREE.Vector3(0, 1, 0))) < 0.92
          ? new THREE.Vector3(0, 1, 0)
          : new THREE.Vector3(1, 0, 0);
        tangent.crossVectors(tangentReference, direction);
      }
      tangent.normalize();
      const bitangent = new THREE.Vector3().crossVectors(direction, tangent).normalize();
      let minU = Infinity;
      let maxU = -Infinity;
      let minV = Infinity;
      let maxV = -Infinity;
      const pointOffset = new THREE.Vector3();

      surfacePoints.forEach((point) => {
        pointOffset.subVectors(point, center);
        const u = pointOffset.dot(tangent);
        const v = pointOffset.dot(bitangent);
        minU = Math.min(minU, u);
        maxU = Math.max(maxU, u);
        minV = Math.min(minV, v);
        maxV = Math.max(maxV, v);
      });

      const surfaceSize = Math.sqrt(totalArea);
      const width = Math.max(maxU - minU, surfaceSize * 0.35);
      const height = Math.max(maxV - minV, surfaceSize * 0.35);

      return { center, direction, area: totalArea, width, height };
    }

    function getBlueLightSize(surface, profile) {
      const surfaceSize = Math.sqrt(surface.area);
      const lightRange = THREE.MathUtils.clamp(
        surfaceSize * profile.lightRangeScale,
        profile.minLightRange,
        profile.maxLightRange
      );

      return { surfaceSize, lightRange };
    }

    function createGlowSpriteTexture() {
      const size = 160;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext("2d");
      const radius = size * 0.5;
      const gradient = context.createRadialGradient(radius, radius, 0, radius, radius, radius);
      gradient.addColorStop(0, "rgba(255, 255, 255, 0.2)");
      gradient.addColorStop(0.18, "rgba(255, 255, 255, 0.22)");
      gradient.addColorStop(0.42, "rgba(235, 246, 255, 0.18)");
      gradient.addColorStop(0.74, "rgba(210, 230, 245, 0.08)");
      gradient.addColorStop(1, "rgba(210, 230, 245, 0)");
      context.fillStyle = gradient;
      context.fillRect(0, 0, size, size);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.generateMipmaps = false;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return texture;
    }

    const blueGlowSpriteTexture = createGlowSpriteTexture();

    function getGlowSpriteDimensions(surface, profile) {
      const surfaceSize = Math.sqrt(surface.area);
      const minDimension = surfaceSize * 0.28;
      return {
        width: Math.max(surface.width, minDimension) * profile.glowSpriteSpreadScale,
        height: Math.max(surface.height, minDimension) * profile.glowSpriteSpreadScale
      };
    }

    function addBlueGlowSprite(surface, profile) {
      if (profile.glowSpriteEnabled === false) return null;

      const spriteDimensions = getGlowSpriteDimensions(surface, profile);
      const surfaceOffset = 0.012;
      const material = new THREE.SpriteMaterial({
        map: blueGlowSpriteTexture,
        color: getProfileColor(profile),
        transparent: true,
        opacity: profile.glowSpriteOpacity,
        blending: THREE.AdditiveBlending,
        depthTest: true,
        depthWrite: false,
        fog: false,
        toneMapped: false
      });
      const sprite = new THREE.Sprite(material);
      sprite.name = `BillboardGlow_${profile.type}`;
      sprite.position.copy(surface.center).addScaledVector(surface.direction, surfaceOffset);
      sprite.scale.set(spriteDimensions.width, spriteDimensions.height, 1);
      sprite.renderOrder = 20;
      sprite.layers.enable(BLOOM_LAYER);
      scene.add(sprite);
      markObjectBloomTargetsDirty();
      return sprite;
    }

    function markBlueLightRuntimeAnchorsDirty(shipState = activeShipVfxState) {
      shipState.blueLightRuntimeAnchorsDirty = true;
    }

    function addBlueLightRuntimeAnchor(shipState, type, mesh, surface, surfaceSize, lightRange, glowSprite, pointLight, materials) {
      const worldToLocalDirectionMatrix = new THREE.Matrix4().copy(mesh.matrixWorld).invert();
      const anchor = {
        type,
        profile: shipState.lightProfiles[type],
        mesh,
        materials,
        surface,
        surfaceSize,
        glowSprite,
        pointLight,
        lightRange,
        spriteOffset: 0.012,
        lightOffset: 0.035,
        pointOffset: THREE.MathUtils.clamp(surfaceSize * 0.14, 0.025, 0.06),
        localCenter: mesh.worldToLocal(surface.center.clone()),
        localDirection: surface.direction.clone().transformDirection(worldToLocalDirectionMatrix).normalize(),
        worldCenter: new THREE.Vector3(),
        worldDirection: new THREE.Vector3(),
        lightOrigin: new THREE.Vector3()
      };

      shipState.blueLightRuntimeAnchors.push(anchor);
      updateBlueLightRuntimeAnchor(anchor);
      return anchor;
    }

    function updateBlueLightRuntimeAnchor(anchor) {
      anchor.mesh.updateWorldMatrix(true, false);
      anchor.worldCenter.copy(anchor.localCenter).applyMatrix4(anchor.mesh.matrixWorld);
      anchor.worldDirection.copy(anchor.localDirection).transformDirection(anchor.mesh.matrixWorld).normalize();

      if (anchor.glowSprite) {
        anchor.glowSprite.position.copy(anchor.worldCenter).addScaledVector(anchor.worldDirection, anchor.spriteOffset);
      }

      if (anchor.pointLight) {
        anchor.pointLight.position.copy(anchor.worldCenter).addScaledVector(anchor.worldDirection, anchor.pointOffset);
      }
    }

    function updateBlueLightRuntimeAnchors(shipState = activeShipVfxState) {
      if (!shipState.blueLightRuntimeAnchorsDirty) return;
      shipState.blueLightRuntimeAnchors.forEach(updateBlueLightRuntimeAnchor);
      shipState.blueLightRuntimeAnchorsDirty = false;
    }

    function getScreenGlowProjectedRadius(anchor, depth) {
      const spriteDimensions = getGlowSpriteDimensions(anchor.surface, anchor.profile);
      const focal = screenGlowSize.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
      const worldRadius = Math.max(spriteDimensions.width, spriteDimensions.height, anchor.surfaceSize) * 0.5;
      return THREE.MathUtils.clamp(
        (worldRadius * focal / Math.max(depth, 0.001)) * screenGlowSettings.radiusScale,
        screenGlowSettings.minRadius,
        screenGlowSettings.maxRadius
      );
    }

    function getScreenGlowFacingAlpha(anchor) {
      screenGlowScratch.toCamera.copy(camera.position)
        .sub(anchor.worldCenter)
        .normalize();
      const facing = THREE.MathUtils.clamp(
        anchor.worldDirection.dot(screenGlowScratch.toCamera) * 1.3 + 0.15,
        0,
        1
      );
      return THREE.MathUtils.lerp(1, facing, screenGlowSettings.facingFade);
    }

    function drawScreenGlowDisc(x, y, radius, color, alpha) {
      const red = Math.round(color.r * 255);
      const green = Math.round(color.g * 255);
      const blue = Math.round(color.b * 255);
      const coreRatio = THREE.MathUtils.clamp(screenGlowSettings.coreRatio, 0, 0.8);
      const clampedAlpha = THREE.MathUtils.clamp(alpha, 0, 1);
      const gradient = screenGlowContext.createRadialGradient(x, y, 0, x, y, radius);
      gradient.addColorStop(0, `rgba(255, 255, 255, ${clampedAlpha * 0.34})`);
      gradient.addColorStop(coreRatio, `rgba(${red}, ${green}, ${blue}, ${clampedAlpha})`);
      gradient.addColorStop(0.48, `rgba(${red}, ${green}, ${blue}, ${clampedAlpha * 0.27})`);
      gradient.addColorStop(1, `rgba(${red}, ${green}, ${blue}, 0)`);

      screenGlowContext.fillStyle = gradient;
      screenGlowContext.beginPath();
      screenGlowContext.arc(x, y, radius, 0, Math.PI * 2);
      screenGlowContext.fill();
    }

    function collectScreenGlowOcclusionTargets(object) {
      const targets = [];
      object.traverse((child) => {
        if (child.isMesh && child.geometry) targets.push(child);
      });
      return targets;
    }

    function isScreenGlowOccluded(shipState, anchor, glowOrigin) {
      if (!screenGlowSettings.occlusionEnabled || !shipState.screenGlowOcclusionTargets.length) return false;

      const targetDistance = camera.position.distanceTo(glowOrigin);
      const bias = Math.max(screenGlowSettings.occlusionBias, anchor.surfaceSize * 0.16);
      screenGlowScratch.rayDirection.copy(glowOrigin)
        .sub(camera.position)
        .normalize();
      screenGlowRaycaster.set(camera.position, screenGlowScratch.rayDirection);
      screenGlowRaycaster.near = camera.near;
      screenGlowRaycaster.far = Math.max(camera.near, targetDistance);
      screenGlowOcclusionHits.length = 0;
      screenGlowRaycaster.intersectObjects(shipState.screenGlowOcclusionTargets, false, screenGlowOcclusionHits);
      window.__glbViewerScreenGlowRaycastCount += 1;

      return screenGlowOcclusionHits.some((hit) => hit.distance < targetDistance - bias);
    }

    function renderScreenSpaceGlow(shipState = activeShipVfxState) {
      const startedAt = performance.now();
      screenGlowContext.clearRect(0, 0, screenGlowSize.width, screenGlowSize.height);
      window.__glbViewerScreenGlowDrawCount = 0;
      window.__glbViewerScreenGlowRaycastCount = 0;
      window.__glbViewerScreenGlowOccludedCount = 0;

      if (!screenGlowSettings.enabled || !shipState?.blueLightRuntimeAnchors?.length) {
        window.__glbViewerScreenGlowRenderMs = performance.now() - startedAt;
        return;
      }

      camera.getWorldDirection(screenGlowScratch.cameraDirection);
      screenGlowContext.save();
      screenGlowContext.globalCompositeOperation = "lighter";

      shipState.blueLightRuntimeAnchors.forEach((anchor) => {
        const lightState = shipState.lightControlState[anchor.type];
        if (!lightState?.screenGlow) return;

        screenGlowScratch.glowOrigin.copy(anchor.worldCenter)
          .addScaledVector(anchor.worldDirection, anchor.spriteOffset);
        const depth = screenGlowScratch.depthVector.copy(screenGlowScratch.glowOrigin)
          .sub(camera.position)
          .dot(screenGlowScratch.cameraDirection);
        if (depth <= camera.near) return;
        if (isScreenGlowOccluded(shipState, anchor, screenGlowScratch.glowOrigin)) {
          window.__glbViewerScreenGlowOccludedCount += 1;
          return;
        }

        screenGlowScratch.projected.copy(screenGlowScratch.glowOrigin).project(camera);
        if (
          screenGlowScratch.projected.x < -1.25 ||
          screenGlowScratch.projected.x > 1.25 ||
          screenGlowScratch.projected.y < -1.25 ||
          screenGlowScratch.projected.y > 1.25
        ) {
          return;
        }

        const x = (screenGlowScratch.projected.x * 0.5 + 0.5) * screenGlowSize.width;
        const y = (-screenGlowScratch.projected.y * 0.5 + 0.5) * screenGlowSize.height;
        const radius = getScreenGlowProjectedRadius(anchor, depth);
        const alpha = anchor.profile.glowSpriteOpacity
          * screenGlowSettings.strength
          * getScreenGlowFacingAlpha(anchor);
        drawScreenGlowDisc(x, y, radius, getProfileColor(anchor.profile), alpha);
        window.__glbViewerScreenGlowDrawCount += 1;
      });

      screenGlowContext.restore();
      window.__glbViewerScreenGlowRenderMs = performance.now() - startedAt;
    }

    function setBloomLayerEnabled(object, enabled) {
      if (enabled) {
        object.layers.enable(BLOOM_LAYER);
      } else {
        object.layers.disable(BLOOM_LAYER);
      }
      markObjectBloomTargetsDirty();
    }

    function applyLightControlState(type, shipState = activeShipVfxState) {
      const state = shipState.lightControlState[type];
      if (!state) return;

      shipState.blueLightRuntimeAnchors
        .filter((anchor) => anchor.type === type)
        .forEach((anchor) => {
          setBloomLayerEnabled(anchor.mesh, state.emissiveBloom);
          if (anchor.glowSprite) anchor.glowSprite.visible = state.billboard;
          if (anchor.pointLight) anchor.pointLight.visible = state.pointLight;
        });
    }

    function applyAllLightControlStates(shipState = activeShipVfxState) {
      Object.keys(shipState.lightControlState).forEach((type) => applyLightControlState(type, shipState));
    }

    function applyLightProfileSettings(type, shipState = activeShipVfxState) {
      const profile = shipState.lightProfiles[type];
      if (!profile) return;

      const color = getProfileColor(profile);
      shipState.blueLightRuntimeAnchors
        .filter((anchor) => anchor.type === type)
        .forEach((anchor) => {
          const { lightRange } = getBlueLightSize(anchor.surface, profile);
          const spriteDimensions = getGlowSpriteDimensions(anchor.surface, profile);
          const pointSizeFactor = THREE.MathUtils.clamp(anchor.surfaceSize / 0.24, 0.55, 1.45);

          anchor.lightRange = lightRange;
          anchor.pointOffset = THREE.MathUtils.clamp(anchor.surfaceSize * 0.14, 0.025, 0.06);

          anchor.materials.forEach((material) => {
            if ("emissive" in material) material.emissive.copy(color);
            if ("emissiveIntensity" in material) material.emissiveIntensity = profile.emissiveIntensity;
          });

          if (anchor.glowSprite) {
            anchor.glowSprite.scale.set(spriteDimensions.width, spriteDimensions.height, 1);
            anchor.glowSprite.material.color.copy(color);
            anchor.glowSprite.material.opacity = profile.glowSpriteOpacity;
          }

          if (anchor.pointLight) {
            anchor.pointLight.color.copy(color);
            anchor.pointLight.intensity = profile.pointIntensity * pointSizeFactor;
            anchor.pointLight.distance = lightRange * profile.pointRangeScale;
          }
        });
    }

    function applyAllLightProfileSettings(shipState = activeShipVfxState) {
      Object.keys(shipState.lightProfiles).forEach((type) => applyLightProfileSettings(type, shipState));
    }

    function interpolateEngineOutputValue(key, shipState = activeShipVfxState) {
      const settings = shipState.engineOutputSettings;
      const t = THREE.MathUtils.clamp(settings.value / 100, 0, 1);
      return THREE.MathUtils.lerp(settings.min[key], settings.max[key], t);
    }

    function applyEngineOutputSettings(shipState = activeShipVfxState) {
      const controlledLightType = shipState.engineOutputSettings.controlledLightType;
      const profile = shipState.lightProfiles[controlledLightType];
      ["emissiveIntensity", "glowSpriteOpacity", "pointIntensity"].forEach((key) => {
        profile[key] = interpolateEngineOutputValue(key, shipState);
      });
      applyLightProfileSettings(controlledLightType, shipState);
      if (lightTypeSelect.value === controlledLightType) syncLightControlPanel(shipState);
    }

    function syncEngineOutputControls(shipState = activeShipVfxState) {
      const settings = shipState.engineOutputSettings;
      engineOutputControls.hidden = lightTypeSelect.value !== settings.controlledLightType;
      engineOutputSlider.value = settings.value;
      engineOutputValue.value = `${Math.round(settings.value)}%`;
      engineMinInputs.forEach((input) => {
        input.value = settings.min[input.dataset.engineMin];
      });
      engineMaxInputs.forEach((input) => {
        input.value = settings.max[input.dataset.engineMax];
      });
    }

    function applyStarBloomSettings() {
      const starBloomActive = isStarBloomActive();
      starBloomPass.strength = starBloomActive ? starBloomSettings.strength : 0;
      starBloomPass.radius = starBloomSettings.radius;
      starBloomPass.threshold = starBloomSettings.threshold;
      bloomCompositePass.material.uniforms.starBloomCompositeStrength.value = starBloomActive ? 1 : 0;
      bloomCompositePass.material.uniforms.starBloomOcclusionStrength.value = isStarOcclusionActive()
        ? starBloomSettings.occlusionStrength
        : 0;

      starBloomObjects.forEach((stars) => {
        stars.visible = starBloomActive;
        stars.material.uniforms.pointSize.value = getStarBloomPointSize(stars.userData.baseSize);
        stars.material.uniforms.opacity.value = THREE.MathUtils.clamp(
          stars.userData.baseOpacity * starBloomSettings.opacityScale,
          0,
          1
        );
        stars.material.uniforms.softness.value = getStarBloomSoftness();
        stars.material.uniforms.falloffPower.value = getStarBloomFalloffPower();
        stars.material.uniforms.alphaCutoff.value = getStarBloomAlphaCutoff();
        stars.material.uniforms.colorMultiplier.value.setRGB(
          starBloomSettings.colorIntensity * starBloomSettings.strength,
          starBloomSettings.colorIntensity * starBloomSettings.strength,
          starBloomSettings.colorIntensity * starBloomSettings.strength
        );
      });
      markStarRenderDirty();
    }

    function syncStarBloomControls() {
      starBloomEnabledInput.checked = starBloomSettings.enabled;
      starBloomParamInputs.forEach((input) => {
        input.value = starBloomSettings[input.dataset.starBloomParam];
      });
    }

    function syncScreenGlowControls() {
      screenGlowEnabledInput.checked = screenGlowSettings.enabled;
      screenGlowParamInputs.forEach((input) => {
        input.value = screenGlowSettings[input.dataset.screenGlowParam];
      });
    }

    function syncLightControlPanel(shipState = activeShipVfxState) {
      const state = shipState.lightControlState[lightTypeSelect.value];
      const profile = shipState.lightProfiles[lightTypeSelect.value];
      if (!state || !profile) return;

      lightControlInputs.forEach((input) => {
        input.checked = Boolean(state[input.dataset.lightControl]);
      });

      lightColorInput.value = profile.color || "#ffffff";
      lightParamInputs.forEach((input) => {
        input.value = profile[input.dataset.lightParam];
      });
      syncEngineOutputControls(shipState);
    }

    lightTypeSelect.addEventListener("change", () => syncLightControlPanel(activeShipVfxState));
    lightColorInput.addEventListener("input", () => {
      const profile = activeShipVfxState.lightProfiles[lightTypeSelect.value];
      if (!profile) return;

      profile.color = lightColorInput.value;
      applyLightProfileSettings(profile.type, activeShipVfxState);
    });
    lightControlInputs.forEach((input) => {
      input.addEventListener("change", () => {
        const type = lightTypeSelect.value;
        const state = activeShipVfxState.lightControlState[type];
        if (!state) return;

        state[input.dataset.lightControl] = input.checked;
        applyLightControlState(type, activeShipVfxState);
      });
    });
    lightParamInputs.forEach((input) => {
      input.addEventListener("input", () => {
        const profile = activeShipVfxState.lightProfiles[lightTypeSelect.value];
        if (!profile) return;

        const value = Number(input.value);
        if (!Number.isFinite(value)) return;

        profile[input.dataset.lightParam] = value;
        applyLightProfileSettings(profile.type, activeShipVfxState);
      });
    });
    engineOutputSlider.addEventListener("input", () => {
      activeShipVfxState.engineOutputSettings.value = Number(engineOutputSlider.value);
      engineOutputValue.value = `${Math.round(activeShipVfxState.engineOutputSettings.value)}%`;
      applyEngineOutputSettings(activeShipVfxState);
    });
    engineMinInputs.forEach((input) => {
      input.addEventListener("input", () => {
        const value = Number(input.value);
        if (!Number.isFinite(value)) return;

        activeShipVfxState.engineOutputSettings.min[input.dataset.engineMin] = value;
        applyEngineOutputSettings(activeShipVfxState);
      });
    });
    engineMaxInputs.forEach((input) => {
      input.addEventListener("input", () => {
        const value = Number(input.value);
        if (!Number.isFinite(value)) return;

        activeShipVfxState.engineOutputSettings.max[input.dataset.engineMax] = value;
        applyEngineOutputSettings(activeShipVfxState);
      });
    });
    starBloomEnabledInput.addEventListener("change", () => {
      starBloomSettings.enabled = starBloomEnabledInput.checked;
      applyStarBloomSettings();
    });
    starBloomParamInputs.forEach((input) => {
      input.addEventListener("input", () => {
        const value = Number(input.value);
        if (!Number.isFinite(value)) return;

        starBloomSettings[input.dataset.starBloomParam] = value;
        applyStarBloomSettings();
      });
    });
    screenGlowEnabledInput.addEventListener("change", () => {
      screenGlowSettings.enabled = screenGlowEnabledInput.checked;
    });
    screenGlowParamInputs.forEach((input) => {
      input.addEventListener("input", () => {
        const value = Number(input.value);
        if (!Number.isFinite(value)) return;

        screenGlowSettings[input.dataset.screenGlowParam] = value;
      });
    });
    syncScreenGlowControls();
    syncStarBloomControls();
    applyStarBloomSettings();

    function collectHighlightMaterials(object, shipState = activeShipVfxState) {
      const materialsByPart = Object.fromEntries(
        Object.keys(shipState.highlight.parts).map((partId) => [partId, new Map()])
      );

      object.traverse((child) => {
        if (!child.isMesh || !child.material) return;

        const materialList = Array.isArray(child.material) ? child.material : [child.material];
        materialList.forEach((material) => {
          const highlightPart = findHighlightPartForMaterial(material, shipState);
          if (!highlightPart) return;
          materialsByPart[highlightPart.id].set(material.uuid, material);
        });
      });

      Object.entries(materialsByPart).forEach(([partId, materials]) => {
        shipState.highlight.parts[partId].materials.length = 0;
        shipState.highlight.parts[partId].materials.push(...materials.values());
      });

      const allMaterials = Object.values(shipState.highlight.parts).flatMap((part) => part.materials);
      window.__glbViewerHighlightMaterials = allMaterials;
      return allMaterials;
    }

    function applyHighlightMaterialColor(shipState = activeShipVfxState) {
      const highlightPart = getActiveHighlightPart(shipState);
      const color = new THREE.Color(highlightPart.settings.color);

      highlightPart.materials.forEach((material) => {
        if ("color" in material) material.color.copy(color);
      });
    }

    function syncHighlightControls(shipState = activeShipVfxState) {
      const highlightPart = getActiveHighlightPart(shipState);
      highlightColorLabel.textContent = highlightPart.label;
      highlightColorInput.value = highlightPart.settings.color;
    }

    highlightColorInput.addEventListener("input", () => {
      getActiveHighlightPart(activeShipVfxState).settings.color = highlightColorInput.value;
      applyHighlightMaterialColor(activeShipVfxState);
    });
    syncHighlightControls(activeShipVfxState);

    function applySubtleBlueEmission(object, shipState = activeShipVfxState) {
      const affectedLights = [];
      const modelCenter = new THREE.Box3().setFromObject(object).getCenter(new THREE.Vector3());

      shipState.blueLightRuntimeAnchors.length = 0;
      shipState.blueEmissionTargets.length = 0;
      object.updateWorldMatrix(true, true);
      object.traverse((child) => {
        if (!child.isMesh || !child.material) return;

        const originalMaterials = Array.isArray(child.material) ? child.material : [child.material];
        const selectedMaterialIndices = getSelectedMaterialIndices(originalMaterials, shipState.definition);
        if (selectedMaterialIndices.length === 0) return;

        const profile = getBlueLightProfile(child, originalMaterials, shipState);
        let meshWasAffected = false;
        const affectedMaterials = [];
        const nextMaterials = originalMaterials.map((material, index) => {
          if (!material || !selectedMaterialIndices.includes(index)) return material;

          const tunedMaterial = material.clone();
          if ("emissive" in tunedMaterial) tunedMaterial.emissive.copy(getProfileColor(profile));
          if ("emissiveIntensity" in tunedMaterial) tunedMaterial.emissiveIntensity = profile.emissiveIntensity;
          if ("toneMapped" in tunedMaterial) tunedMaterial.toneMapped = false;
          tunedMaterial.needsUpdate = true;

          meshWasAffected = true;
          affectedMaterials.push(tunedMaterial);
          return tunedMaterial;
        });

        if (!meshWasAffected) return;

        child.material = Array.isArray(child.material) ? nextMaterials : nextMaterials[0];
        child.layers.enable(BLOOM_LAYER);

        const surface = getBlueLightSurface(child, selectedMaterialIndices, modelCenter);
        if (!surface) return;

        const { surfaceSize, lightRange } = getBlueLightSize(surface, profile);
        const lightOrigin = surface.center.clone().addScaledVector(surface.direction, 0.035);

        const pointLight = addBlueSurfacePointLight(lightOrigin, lightRange, profile, surfaceSize);
        const glowSprite = addBlueGlowSprite(surface, profile);
        addBlueLightRuntimeAnchor(
          shipState,
          profile.type,
          child,
          surface,
          surfaceSize,
          lightRange,
          glowSprite,
          pointLight,
          affectedMaterials
        );
        affectedLights.push({
          name: child.name || child.uuid,
          type: profile.type,
          surfaceArea: surface.area,
          surfaceSize,
          surfaceWidth: surface.width,
          surfaceHeight: surface.height,
          lightRange,
          glowSpriteWidth: glowSprite?.scale.x ?? 0,
          glowSpriteHeight: glowSprite?.scale.y ?? 0,
          pointRange: pointLight?.distance ?? 0,
          pointIntensity: pointLight?.intensity ?? 0
        });
      });

      shipState.blueEmissionTargets.push(...affectedLights);
      window.__glbViewerBlueLights = shipState.blueEmissionTargets;
      window.__glbViewerBlueLightRuntimeAnchors = shipState.blueLightRuntimeAnchors;
      return affectedLights;
    }

    function summarizeModel(object, shipDefinition = ACTIVE_SHIP_DEFINITION) {
      const materials = new Map();
      let meshCount = 0;
      let textureSlotCount = 0;

      object.traverse((child) => {
        if (!child.isMesh) return;
        meshCount += 1;
        child.castShadow = true;
        child.receiveShadow = true;

        const materialList = Array.isArray(child.material) ? child.material : [child.material];
        materialList.forEach((material) => {
          if (!material) return;
          if ("envMapIntensity" in material) {
            material.envMapIntensity = shipDefinition.materials.reflectionIntensity;
            material.needsUpdate = true;
          }
          materials.set(material.uuid, material);
          ["map", "normalMap", "roughnessMap", "metalnessMap", "emissiveMap", "aoMap"].forEach((slot) => {
            if (material[slot]) textureSlotCount += 1;
          });
        });
      });

      return {
        meshCount,
        materialCount: materials.size,
        textureSlotCount,
        materialNames: Array.from(materials.values())
          .map((material) => material.name || material.type)
          .slice(0, 16)
      };
    }

    async function loadViewerModel() {
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(ACTIVE_SHIP_DEFINITION.asset.url);
      const object = normalizeObject(gltf.scene, ACTIVE_SHIP_DEFINITION);
      const shipState = createShipVfxState(ACTIVE_SHIP_DEFINITION, object);
      activeShipVfxState = shipState;
      shipState.screenGlowOcclusionTargets = collectScreenGlowOcclusionTargets(object);
      scene.add(object);
      markObjectBloomTargetsDirty();
      const blueEmissionTargets = applySubtleBlueEmission(object, shipState);
      const highlightTargets = collectHighlightMaterials(object, shipState);
      applyHighlightMaterialColor(shipState);
      applyAllLightProfileSettings(shipState);
      applyAllLightControlStates(shipState);
      lightControls.hidden = false;
      syncHighlightControls(shipState);
      syncLightControlPanel(shipState);

      const box = new THREE.Box3().setFromObject(object);
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      controls.target.copy(sphere.center);
      camera.position.copy(sphere.center).add(new THREE.Vector3(0, sphere.radius * 0.35, sphere.radius * 2.3));
      camera.near = Math.max(0.01, sphere.radius / 100);
      camera.far = Math.max(80000, sphere.radius * 100);
      camera.updateProjectionMatrix();
      controls.update();
      markStarRenderDirty();
      markObjectBloomTargetsDirty();
      markBlueLightRuntimeAnchorsDirty(shipState);

      const modelSummary = summarizeModel(object, ACTIVE_SHIP_DEFINITION);
      status.textContent = `Loaded GLB: ${modelSummary.meshCount} meshes, ${modelSummary.materialCount} materials, ${modelSummary.textureSlotCount} texture slots. Bloom targets: ${blueEmissionTargets.length}.`;
      summary.textContent = [
        `${ACTIVE_SHIP_DEFINITION.id}: ${ACTIVE_SHIP_DEFINITION.asset.url}`,
        `Environment: ${ACTIVE_SPACE_ENVIRONMENT.id}`,
        "",
        `Meshes: ${modelSummary.meshCount}`,
        `Materials: ${modelSummary.materialCount}`,
        `Texture slots: ${modelSummary.textureSlotCount}`,
        `Bloom targets: ${blueEmissionTargets.length}`,
        `Highlight targets: ${highlightTargets.length}, color ${getActiveHighlightPart(shipState).settings.color}`,
        `2D screen glow: strength ${screenGlowSettings.strength}, radius scale ${screenGlowSettings.radiusScale}, occlusion ${screenGlowSettings.occlusionEnabled}`,
        `Selective bloom: strength ${BLOOM_STRENGTH}, radius ${BLOOM_RADIUS}, threshold ${BLOOM_THRESHOLD}`,
        `Star bloom: strength ${starBloomSettings.strength}, radius ${starBloomSettings.radius}, threshold ${starBloomSettings.threshold}, occlusion ${starBloomSettings.occlusionStrength}`,
        ...blueEmissionTargets.map((light) => {
          return `- ${light.name}: ${light.type}, surface ${light.surfaceWidth.toFixed(3)}x${light.surfaceHeight.toFixed(3)}, range ${light.lightRange.toFixed(3)}, billboard ${light.glowSpriteWidth.toFixed(3)}x${light.glowSpriteHeight.toFixed(3)}, point ${light.pointIntensity.toFixed(3)}/${light.pointRange.toFixed(3)}`;
        }),
        "",
        "Materials:",
        ...modelSummary.materialNames.map((name) => `- ${name}`)
      ].join("\n");

      window.__glbViewerModel = object;
      window.__glbViewerShipVfxState = shipState;
      window.__glbViewerShipVfxStates = [shipState];
      window.__glbViewerSummary = modelSummary;
    }

    function animate() {
      controls.update();
      updateBlueLightRuntimeAnchors();
      updateStarRenderDirtyForCamera();
      if (isStarOcclusionActive() && starOcclusionRenderDirty) {
        renderStarOcclusionMask();
      }
      renderBloom(bloomComposer, bloomLayer);
      if (isStarBloomActive() && starBloomRenderDirty) {
        renderStarBloom();
      }
      finalComposer.render();
      renderScreenSpaceGlow();
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeScreenGlowCanvas();
      updateStarPointScales();
      markStarRenderDirty();
      bloomComposer.setSize(window.innerWidth, window.innerHeight);
      starBloomRenderTarget.setSize(window.innerWidth, window.innerHeight);
      starOcclusionRenderTarget.setSize(window.innerWidth, window.innerHeight);
      finalComposer.setSize(window.innerWidth, window.innerHeight);
    });

    loadViewerModel().catch((error) => {
      status.textContent = `Load failed: ${error.message}`;
      console.error(error);
    });

    animate();
  </script>
</body>
</html>
